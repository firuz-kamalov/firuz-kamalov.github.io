/* ==================== State & storage ==================== */
const PREF_KEY='y10:prefs', STAT_KEY='y10:stats', HIST_PREFIX='y10:hist:';

/* ---- Which syllabus this book is set to. Change these two words to re-point it. ----
   DEFAULT_TIER : 'higher'     (grades 4-9)   or 'foundation' (grades 1-5)
   DEFAULT_SPEC : 'gcse'       (Edexcel GCSE 1MA1, the UK paper)
                  'igcse'      (Edexcel International GCSE 4MA1)
   The tier decides how hard the topic list goes; the specification decides which
   topics exist at all. See the note at the foot of the home screen.            */
const DEFAULT_TIER='higher';
const DEFAULT_SPEC='gcse';

const state={
  screen:'home',
  tier:DEFAULT_TIER,
  spec:DEFAULT_SPEC,
  mode:'full',
  answerMode:'type',      /* mixed: typed where an answer is a number, multiple choice otherwise */
  selected:[],
  count:20,
  ladder:'increasing',
  quiz:null,
  history:[],
  stats:{},
  lastEntry:null,
  theme:'auto'
};
function loadJSON(key,fallback){ try{ const v=localStorage.getItem(key); return v? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveJSON(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }
function loadAll(){
  const prefs=loadJSON(PREF_KEY,{});
  ['count','theme'].forEach(k=>{ if(prefs[k]!==undefined) state[k]=prefs[k]; });
  state.stats=loadJSON(STAT_KEY,{});
  const items=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf(HIST_PREFIX)===0){ const v=localStorage.getItem(k); if(v) items.push(JSON.parse(v)); }
    }
  }catch(e){}
  items.sort((a,b)=>b.ts-a.ts);
  state.history=items;
  applyTheme();
}
function savePrefs(){ saveJSON(PREF_KEY,{count:state.count,theme:state.theme}); }
function recordStat(sub,correct){
  if(!state.stats[sub]) state.stats[sub]={seen:0,correct:0};
  state.stats[sub].seen++;
  if(correct) state.stats[sub].correct++;
  saveJSON(STAT_KEY,state.stats);
}
function systemPrefersDark(){
  try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
}
function effectiveTheme(){ return state.theme==='auto'? (systemPrefersDark()?'dark':'light') : state.theme; }
function applyTheme(){
  /* No stamp while on 'auto', so the reader's own system setting decides. */
  if(state.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
}
function toggleTheme(){ state.theme = effectiveTheme()==='dark'?'light':'dark'; applyTheme(); savePrefs(); render(); }

/* ==================== Answer checking ==================== */
/* A question is answerable by typing only when its answer reduces to a single
   number (or a single fraction). Anything algebraic stays multiple choice. */
function typedTarget(correctStr){
  let plain=stripMarkup(correctStr).trim();
  plain=plain.replace(/^(AED|aed|£|\$|€)\s*/,'');          /* currency label */
  plain=plain.replace(/^[a-zA-Z](\^-?1)?\s*=\s*/,'');       /* "x = " */
  plain=plain.replace(/(?:\s+[a-zA-Z][a-zA-Z°/^]*[23]?|°)\s*$/,''); /* trailing unit: " cm", " m/s", " cm^2", "°" */
  plain=plain.replace(/\s+/g,'');
  const m=plain.match(/^(-?\d+(?:\.\d+)?)(?:\/(-?\d+(?:\.\d+)?))?$/);
  if(!m) return null;                                        /* anything algebraic stays multiple choice */
  const den=m[2]===undefined? 1 : parseFloat(m[2]);
  if(den===0) return null;
  const value=parseFloat(m[1])/den;
  if(!isFinite(value)) return null;
  return {value:value, isFraction:m[2]!==undefined, plain:plain};
}
function checkTyped(input,correctStr){
  const t=typedTarget(correctStr);
  if(!t) return false;
  let cleaned=String(input).replace(/[−–—]/g,'-').replace(/,/g,'').trim();
  cleaned=cleaned.replace(/^(AED|aed|£|\$|€)\s*/,'');
  cleaned=cleaned.replace(/^[a-zA-Z](\^-?1)?\s*=\s*/,'');
  cleaned=cleaned.replace(/(?:\s+[a-zA-Z][a-zA-Z°/^]*[23]?|°)\s*$/,'');
  cleaned=cleaned.replace(/\s+/g,'');
  const v=parseNumeric(cleaned);
  if(v===null) return false;
  /* Exact: a question that asks for 2 d.p. is not satisfied by 3 d.p., and an
     equivalent fraction (22/24 for 11/12) is still the right value, so it counts. */
  return Math.abs(v-t.value)<=1e-9*Math.max(1,Math.abs(t.value))+1e-9;
}
function isTypeable(q){ return typedTarget(q.choices[q.correctIndex])!==null; }

/* ==================== Question selection ==================== */
function pickEntry(pool,targetDiff){
  let candidates=pool.filter(e=>e.diff===targetDiff);
  if(!candidates.length){
    const diffs=[...new Set(pool.map(e=>e.diff))].sort((a,b)=>Math.abs(a-targetDiff)-Math.abs(b-targetDiff));
    candidates=pool.filter(e=>e.diff===diffs[0]);
  }
  return choice(candidates);
}
function buildLadder(n,pattern){
  if(pattern==='mixed') return Array.from({length:n},()=>choice([1,2,3,4]));
  return Array.from({length:n},(_,i)=>{
    const f= n>1? i/(n-1) : 0;
    return f<0.25?1 : f<0.55?2 : f<0.8?3 : 4;
  });
}
function weakPool(){
  const avail=availableGens();
  const scored=avail.map(g=>{
    const s=state.stats[g.sub];
    if(!s||s.seen<2) return {g, score:0.55};              /* untested topics are worth a look */
    return {g, score:1-(s.correct/s.seen)};
  }).filter(x=>x.score>0.25);
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,12).map(x=>x.g);
  return top.length? top : avail;
}
function currentPool(){
  if(state.mode==='weak') return weakPool();
  const chapters= state.mode==='full'? CHAPTERS.map(c=>c.id) : state.selected;
  const pool=availableGens().filter(g=>chapters.indexOf(g.ch)>=0);
  return pool;
}
function makeQuestion(entry){
  let q;
  try{ q=entry.fn(); }catch(err){ q=null; }
  if(!q) q={topic:'Number',subtopic:'Rounding & significant figures',text:'Round 3.146 to 2 decimal places.',choices:['3.15','3.14','3.1','3.2'],correctIndex:0,explanation:'The third decimal is 6, so round up: 3.15.'};
  q.subtopic=entry.sub;
  q.chapter=entry.ch;
  q.difficulty=entry.diff;
  return q;
}
function buildQuestions(n,pool){
  const ladder=buildLadder(n,state.ladder);
  const out=[]; const recent=[];
  ladder.forEach(d=>{
    let entry, guard=0;
    do{ entry=pickEntry(pool,d); guard++; }while(recent.indexOf(entry.sub)>=0 && guard<12);
    recent.push(entry.sub); if(recent.length>3) recent.shift();
    out.push(makeQuestion(entry));
  });
  return out;
}

/* ==================== Quiz flow ==================== */
function startQuiz(){
  const pool=currentPool();
  if(!pool.length){ alert('Pick at least one chapter first.'); return; }
  state.quiz={
    questions:buildQuestions(state.count,pool),
    index:0, correctCount:0, answered:null, typed:'', typedCorrect:null,
    breakdown:{}, log:[]
  };
  state.screen='quiz';
  render();
}
function gradeCurrent(payload){
  const q=state.quiz;
  const question=q.questions[q.index];
  let isCorrect, given;
  if(payload.type==='choice'){
    given=question.choices[payload.index];
    isCorrect=payload.index===question.correctIndex;
    q.answered=payload.index;
  }else{
    given=payload.text;
    isCorrect=checkTyped(payload.text,question.choices[question.correctIndex]);
    q.answered='typed';
    q.typedCorrect=isCorrect;
  }
  if(isCorrect) q.correctCount++;
  const ch=CHAPTERS.find(c=>c.id===question.chapter);
  const key= ch? ch.label : question.topic;
  if(!q.breakdown[key]) q.breakdown[key]={correct:0,total:0};
  q.breakdown[key].total++;
  if(isCorrect) q.breakdown[key].correct++;
  q.log.push({text:question.text, sub:question.subtopic, given:given, correct:question.choices[question.correctIndex], ok:isCorrect, explanation:question.explanation});
  recordStat(question.subtopic,isCorrect);
  render();
}
function answerChoice(i){ if(state.quiz.answered!==null) return; gradeCurrent({type:'choice',index:i}); }
function submitTyped(){
  if(state.quiz.answered!==null) return;
  const el=document.getElementById('typed-input');
  const val=el? el.value.trim() : '';
  if(val===''){ if(el) el.focus(); return; }
  gradeCurrent({type:'typed',text:val});
}
function nextQuestion(){
  const q=state.quiz;
  if(q.index+1<q.questions.length){ q.index++; q.answered=null; q.typedCorrect=null; render(); }
  else finishQuiz();
}
function finishQuiz(){
  const q=state.quiz;
  const now=new Date();
  const entry={
    id:uid(), ts:now.getTime(),
    date:now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),
    time:now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    total:q.questions.length, correct:q.correctCount, breakdown:q.breakdown,
    tier:state.tier, spec:state.spec,
    mode: state.mode==='full'?'Full curriculum': state.mode==='weak'?'Weak topics': state.selected.map(id=>CHAPTERS.find(c=>c.id===id).label).join(', '),
    log:q.log
  };
  state.history.unshift(entry);
  saveJSON(HIST_PREFIX+entry.id,entry);
  state.lastEntry=entry;
  state.screen='summary';
  render();
}
function clearHistory(){
  if(!confirm('Delete all saved results and topic progress?')) return;
  state.history.forEach(h=>{ try{ localStorage.removeItem(HIST_PREFIX+h.id); }catch(e){} });
  state.history=[]; state.stats={}; saveJSON(STAT_KEY,{});
  render();
}

/* ==================== Rendering ==================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function diffDots(d){ return '<span class="topic-chip" title="difficulty">'+'●'.repeat(d)+'○'.repeat(4-d)+'</span>'; }
function setPref(key,val){ state[key]=val; savePrefs(); render(); }
function setMode(m){ state.mode=m; render(); }
function toggleChapter(id){
  if(!chapterGens(id).length) return;
  const i=state.selected.indexOf(id);
  if(i>=0) state.selected.splice(i,1); else state.selected.push(id);
  render();
}
function go(screen){ state.screen=screen; render(); }

function render(){
  const app=document.getElementById('app');
  let content='';
  if(state.screen==='home') content=renderHome();
  else if(state.screen==='quiz') content=renderQuiz();
  else if(state.screen==='summary') content=renderSummary();
  else if(state.screen==='review') content=renderReview();
  else if(state.screen==='history') content=renderHistory();
  else if(state.screen==='progress') content=renderProgress();
  app.innerHTML=
    '<div class="topbar">'+
      '<div class="brand"><h1>Year 10 Math</h1><span class="chapter-tag">'+(state.tier==='higher'?'Higher':'Foundation')+' · '+(state.spec==='gcse'?'GCSE 1MA1':'IGCSE 4MA1')+'</span></div>'+
      '<div style="display:flex;gap:8px;">'+
        '<div class="iconbtn" onclick="go(\'progress\')" title="Progress">Progress</div>'+
        '<div class="iconbtn" onclick="go(\'history\')" title="History">☷</div>'+
        '<div class="iconbtn" onclick="toggleTheme()" title="Light or dark">'+(effectiveTheme()==='dark'?'☀':'☾')+'</div>'+
      '</div>'+
    '</div>'+content;
  const input=document.getElementById('typed-input');
  if(input) input.focus();
}

function renderHome(){
  const chapters=CHAPTERS.filter(c=>chapterGens(c.id).length).map(c=>{
    const n=chapterGens(c.id).length;
    const sel=state.selected.indexOf(c.id)>=0;
    return '<div class="chapter-row '+(sel?'selected':'')+'" onclick="toggleChapter(\''+c.id+'\')">'+
      '<div class="chapter-num">0'+c.n+'</div>'+
      '<div><div class="chapter-label">'+c.label+'</div>'+
      '<div class="chapter-sub">'+n+' topic'+(n>1?'s':'')+'</div></div></div>';
  }).join('');
  const total=availableGens().length;
  return ''+
  '<div class="page">'+
    '<div class="eyebrow">New practice set</div>'+
    '<div class="section-title">Ready for some practice?</div>'+
    '<div class="muted">Genius is 1% talent and 99% hard work.</div>'+

    '<div class="eyebrow" style="margin-top:22px;">Topics</div>'+
    '<div class="seg">'+
      '<div class="seg-btn '+(state.mode==='full'?'active':'')+'" onclick="setMode(\'full\')">Everything</div>'+
      '<div class="seg-btn '+(state.mode==='choose'?'active':'')+'" onclick="setMode(\'choose\')">Choose chapters</div>'+
    '</div>'+

    '<div class="eyebrow" style="margin-top:20px;">How many questions?</div>'+
    '<div class="count-row">'+[20,30,40].map(n=>'<div class="count-btn '+(state.count===n?'active':'')+'" onclick="setPref(\'count\','+n+')">'+n+'</div>').join('')+'</div>'+

    '<button class="btn-primary" onclick="startQuiz()">Start practice →</button>'+
    '<div class="note">Set for the <b>'+(state.tier==='higher'?'Higher':'Foundation')+' tier</b> of <b>'+(state.spec==='gcse'?'Edexcel GCSE 1MA1':'Edexcel International GCSE 4MA1')+'</b>. Questions get harder as the set goes on, like a real paper.</div>'+
  '</div>'+

function renderRecentStrip(){
  const last=state.history[0];
  return '<div class="muted" style="margin-top:16px;text-align:center;">Last set: '+last.correct+'/'+last.total+' ('+pct(last.correct,last.total)+'%) on '+last.date+
    ' — <a href="#" onclick="go(\'progress\');return false;">see progress</a></div>';
}

function renderQuiz(){
  const q=state.quiz;
  const question=q.questions[q.index];
  const progress=Math.round(q.index/q.questions.length*100);
  const answered=q.answered!==null;
  const correctText=question.choices[question.correctIndex];
  const useTyping= state.answerMode==='type' && isTypeable(question);
  let answerBlock;
  if(useTyping){
    const ok=q.typedCorrect;
    answerBlock='<div class="type-row">'+
      '<input id="typed-input" class="type-input'+(answered? (ok?' ok':' no') :'')+'" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="your answer" value="'+(answered?esc(q.log[q.log.length-1].given):'')+'" '+(answered?'disabled':'')+' onkeydown="if(event.key===\'Enter\'){submitTyped();}">'+
      (answered?'':'<button class="btn-check" onclick="submitTyped()">Check</button>')+
    '</div>'+
    (answered? '<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct':'Not quite — the answer is <b>'+correctText+'</b>')+'</div>' : '<div class="note">Type the number only. Units and currency symbols are optional.</div>');
  }else{
    answerBlock='<div class="choices">'+question.choices.map((c,i)=>{
      let cls='choice';
      if(answered){ cls+=' disabled'; if(i===question.correctIndex) cls+=' correct'; else if(i===q.answered) cls+=' wrong'; }
      return '<div class="'+cls+'" onclick="answerChoice('+i+')"><div class="letter">'+String.fromCharCode(65+i)+'</div><div>'+c+'</div></div>';
    }).join('')+'</div>';
  }
  return '<div class="page">'+
    '<div class="quiz-progress">'+
      '<span class="qnum">Q'+(q.index+1)+' / '+q.questions.length+'</span>'+
      '<div class="ruler"><div class="ruler-fill" style="width:'+progress+'%"></div></div>'+
      '<span class="qnum">'+q.correctCount+' right</span>'+
    '</div>'+
    '<div class="topic-row"><span class="topic-chip">'+question.subtopic+'</span>'+diffDots(question.difficulty)+'</div>'+
    '<div class="question-text">'+question.text+'</div>'+
    answerBlock+
    (answered? '<div class="explain">'+question.explanation+'</div>'+
      '<button class="btn-primary" onclick="nextQuestion()">'+(q.index+1<q.questions.length?'Next question →':'See results →')+'</button>' : '')+
    '<div class="note">'+(useTyping?'Press Enter to check.':'Press 1–4 or A–D to answer.')+' Then Enter for the next question.</div>'+
  '</div>';
}

function renderSummary(){
  const e=state.lastEntry;
  const p=pct(e.correct,e.total);
  const rows=Object.keys(e.breakdown).map(k=>{
    const st=e.breakdown[k], pc=pct(st.correct,st.total);
    return '<div class="breakdown-row"><div class="breakdown-label">'+k+'</div>'+
      '<div class="breakdown-bar"><div class="breakdown-fill '+(pc<60?'weak':'')+'" style="width:'+pc+'%"></div></div>'+
      '<div class="breakdown-val">'+st.correct+'/'+st.total+'</div></div>';
  }).join('');
  const missed=e.log.filter(l=>!l.ok).map(l=>l.sub);
  const uniqueMissed=[...new Set(missed)];
  const message= p>=90? 'Excellent — that is exam-ready on these topics.' : p>=70? 'Solid. Tidy up the misses below and this is a strong set.' : p>=50? 'A fair start. The topics below are where the marks went.' : 'Worth slowing down and working through the explanations for each miss.';
  return '<div class="page">'+
    '<div class="eyebrow">Results</div>'+
    '<div class="score-big">'+e.correct+'/'+e.total+'</div>'+
    '<div class="score-sub">'+p+'% · '+e.mode+' · '+(e.tier==='higher'?'Higher':'Foundation')+' · '+(e.spec==='gcse'?'1MA1':'4MA1')+'</div>'+
    '<div class="muted" style="margin-top:10px;">'+message+'</div>'+
    '<div style="margin-top:18px;">'+rows+'</div>'+
    '<button class="btn-primary" onclick="go(\'review\')">Review every question →</button>'+
    (uniqueMissed.length? '<button class="btn-ghost" onclick="state.mode=\'weak\';startQuiz()">Practice my weak topics</button>':'')+
    '<button class="btn-ghost" onclick="go(\'home\')">Back to the start</button>'+
  '</div>';
}

function renderReview(){
  const e=state.lastEntry;
  const items=e.log.map((l,i)=>
    '<div class="review-item">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px;">'+
        '<span class="topic-chip">'+l.sub+'</span>'+
        '<span class="review-tag '+(l.ok?'ok':'no')+'">'+(l.ok?'correct':'missed')+'</span>'+
      '</div>'+
      '<div class="review-q"><b>Q'+(i+1)+'.</b> '+l.text+'</div>'+
      '<div class="review-ans">Your answer: '+esc(String(l.given))+(l.ok?'':' · Correct answer: <b>'+l.correct+'</b>')+'</div>'+
      '<div class="review-ans" style="margin-top:6px;">'+l.explanation+'</div>'+
    '</div>').join('');
  return '<div class="page"><div class="eyebrow">Review</div><div class="section-title">'+e.correct+'/'+e.total+' on '+e.date+'</div>'+
    '<div style="margin-top:14px;">'+items+'</div>'+
    '<button class="btn-ghost" onclick="go(\'home\')">Done</button></div>';
}

function renderProgress(){
  const subs=Object.keys(state.stats);
  if(!subs.length) return '<div class="page"><div class="eyebrow">Progress</div><div class="section-title">Nothing tracked yet</div>'+
    '<div class="muted">Finish a practice set and this page will show which topics are solid and which need work.</div>'+
    '<button class="btn-primary" onclick="go(\'home\')">Start a set</button></div>';
  const totalSeen=subs.reduce((s,k)=>s+state.stats[k].seen,0);
  const totalRight=subs.reduce((s,k)=>s+state.stats[k].correct,0);
  const byChapter=CHAPTERS.map(c=>{
    const gens=GEN.filter(g=>g.ch===c.id).map(g=>g.sub);
    let seen=0, right=0;
    gens.forEach(s=>{ if(state.stats[s]){ seen+=state.stats[s].seen; right+=state.stats[s].correct; } });
    return {label:c.label, seen, right};
  }).filter(c=>c.seen>0);
  const chapterRows=byChapter.map(c=>{
    const pc=pct(c.right,c.seen);
    return '<div class="breakdown-row"><div class="breakdown-label">'+c.label+'</div>'+
      '<div class="breakdown-bar"><div class="breakdown-fill '+(pc<60?'weak':'')+'" style="width:'+pc+'%"></div></div>'+
      '<div class="breakdown-val">'+pc+'%</div></div>';
  }).join('');
  const weak=subs.map(k=>({sub:k, s:state.stats[k], acc:state.stats[k].correct/state.stats[k].seen}))
    .filter(x=>x.s.seen>=2 && x.acc<0.75).sort((a,b)=>a.acc-b.acc).slice(0,6);
  const strong=subs.map(k=>({sub:k, s:state.stats[k], acc:state.stats[k].correct/state.stats[k].seen}))
    .filter(x=>x.s.seen>=3 && x.acc>=0.85).sort((a,b)=>b.acc-a.acc).slice(0,6);
  return '<div class="page">'+
    '<div class="eyebrow">Progress</div>'+
    '<div class="score-big">'+pct(totalRight,totalSeen)+'%</div>'+
    '<div class="score-sub">'+totalRight+' correct out of '+totalSeen+' questions · '+subs.length+' topics touched</div>'+
    '<div class="eyebrow" style="margin-top:20px;">By chapter</div>'+chapterRows+
    (weak.length? '<div class="eyebrow" style="margin-top:20px;">Needs work</div>'+
      weak.map(w=>'<div class="breakdown-row"><div class="breakdown-label">'+w.sub+'</div>'+
        '<div class="breakdown-bar"><div class="breakdown-fill weak" style="width:'+Math.round(w.acc*100)+'%"></div></div>'+
        '<div class="breakdown-val">'+w.s.correct+'/'+w.s.seen+'</div></div>').join(''):'')+
    (strong.length? '<div class="eyebrow" style="margin-top:20px;">Secure</div><div class="muted">'+strong.map(s=>s.sub).join(' · ')+'</div>':'')+
    '<button class="btn-primary" onclick="state.mode=\'weak\';startQuiz()">Practice my weak topics →</button>'+
    '<button class="btn-ghost" onclick="go(\'home\')">Back</button>'+
  '</div>';
}

function renderHistory(){
  if(!state.history.length) return '<div class="page"><div class="eyebrow">History</div><div class="section-title">No sets yet</div>'+
    '<div class="muted">Your last results will be listed here.</div><button class="btn-primary" onclick="go(\'home\')">Start a set</button></div>';
  const rows=state.history.slice(0,30).map(h=>{
    const p=pct(h.correct,h.total);
    return '<div class="history-row"><div style="flex:1;"><div style="font-weight:600;font-size:14px;">'+h.correct+'/'+h.total+' <span class="qnum">('+p+'%)</span></div>'+
      '<div class="chapter-sub">'+h.date+' '+h.time+' · '+h.mode+'</div></div>'+
      '<div class="breakdown-bar" style="max-width:110px;"><div class="breakdown-fill '+(p<60?'weak':'')+'" style="width:'+p+'%"></div></div></div>';
  }).join('');
  return '<div class="page"><div class="eyebrow">History</div><div class="section-title">Recent sets</div>'+
    '<div style="margin-top:12px;">'+rows+'</div>'+
    '<button class="btn-ghost" onclick="go(\'home\')">Back</button>'+
    '<button class="btn-ghost" onclick="clearHistory()">Clear all saved data</button></div>';
}

/* ==================== Keyboard ==================== */
document.addEventListener('keydown',function(ev){
  if(state.screen!=='quiz'||!state.quiz) return;
  const q=state.quiz;
  const typing= document.activeElement && document.activeElement.id==='typed-input';
  if(q.answered!==null){
    if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); nextQuestion(); }
    return;
  }
  if(typing) return;
  const k=ev.key.toLowerCase();
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
  if(map[k]!==undefined && state.answerMode!=='type'){ ev.preventDefault(); answerChoice(map[k]); }
});

/* ==================== Boot ==================== */
loadAll();
render();
</script>
</body>
