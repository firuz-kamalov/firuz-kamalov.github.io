<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 10 Math — GCSE Practice Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3EC;
    --grid:#D2E0CE;
    --paper:#FFFFFF;
    --ink:#1F2E28;
    --ink-soft:#5E7169;
    --margin:#C25E4E;
    --accent:#2F7A5B;
    --accent-soft:#E3F1EA;
    --correct:#2F8F5B;
    --correct-bg:#E4F5EC;
    --wrong:#C1443B;
    --wrong-bg:#FBE7E5;
    --chip:#E1EBDD;
    --line:#E2EBE0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--grid) 27px, var(--grid) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--grid) 27px, var(--grid) 28px),
      var(--bg);
    min-height:100vh;
    padding:24px 16px 60px;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand h1{font-size:22px;letter-spacing:-0.02em;}
  .brand .chapter-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .iconbtn{
    background:var(--paper);border:1px solid var(--grid);border-radius:10px;
    min-width:38px;height:38px;padding:0 10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:15px;color:var(--ink-soft);user-select:none;
  }
  .iconbtn:hover{border-color:var(--ink-soft);}
  .page{
    background:var(--paper);
    border-radius:6px;
    position:relative;
    padding:28px 26px 28px 46px;
    box-shadow:0 1px 2px rgba(31,46,40,0.06), 0 8px 24px rgba(31,46,40,0.07);
    border:1px solid var(--line);
  }
  .page::before{content:'';position:absolute;left:26px;top:0;bottom:0;width:1px;background:var(--margin);opacity:0.5;}
  .page::after{
    content:'';position:absolute;left:11px;top:22px;bottom:22px;width:8px;
    background-image:radial-gradient(circle, var(--bg) 3px, transparent 3.2px);
    background-size:8px 26px;background-repeat:repeat-y;
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
  .section-title{font-size:20px;margin-bottom:4px;letter-spacing:-0.01em;}
  .muted{color:var(--ink-soft);font-size:14px;line-height:1.55;}
  .seg{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .seg-btn{
    flex:1 1 auto;min-width:120px;text-align:center;padding:10px 12px;border-radius:10px;
    border:1.5px solid var(--grid);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);
    background:var(--paper);transition:border-color .15s, background .15s, color .15s;user-select:none;
  }
  .seg-btn:hover{border-color:var(--ink-soft);}
  .seg-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .seg-btn .sub{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px;font-family:'IBM Plex Mono',monospace;}
  .chapters{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .chapter-row{
    display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--grid);cursor:pointer;transition:border-color .15s, background .15s;user-select:none;
  }
  .chapter-row:hover{border-color:var(--ink-soft);}
  .chapter-row.selected{border-color:var(--accent);background:var(--accent-soft);}
  .chapter-row.empty{opacity:.42;cursor:not-allowed;}
  .chapter-num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);width:24px;flex:none;}
  .chapter-label{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .chapter-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .count-row{display:flex;gap:8px;margin-top:8px;}
  .count-btn{
    flex:1;text-align:center;padding:11px 0;border-radius:10px;border:1.5px solid var(--grid);
    cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink-soft);user-select:none;
  }
  .count-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .btn-primary{
    width:100%;margin-top:22px;padding:14px;border:none;border-radius:10px;background:var(--accent);
    color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{
    width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--grid);border-radius:10px;background:var(--paper);
    color:var(--ink-soft);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .qnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .ruler{flex:1;height:6px;background:var(--chip);border-radius:99px;overflow:hidden;}
  .ruler-fill{height:100%;background:var(--accent);transition:width .25s;}
  .topic-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .topic-chip{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--chip);color:var(--ink-soft);
    padding:4px 9px;border-radius:99px;letter-spacing:.02em;
  }
  .topic-chip.only{background:#FBEFD9;color:#7A5A12;}
  .question-text{font-size:17px;line-height:1.6;margin-bottom:16px;}
  .question-text .num{font-family:'IBM Plex Mono',monospace;}
  .choices{display:flex;flex-direction:column;gap:9px;}
  .choice{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--grid);cursor:pointer;font-size:15px;transition:border-color .12s, background .12s;
  }
  .choice:hover{border-color:var(--ink-soft);}
  .choice .letter{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    width:24px;height:24px;flex:none;border-radius:6px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;
  }
  .choice.disabled{cursor:default;}
  .choice.disabled:hover{border-color:var(--grid);}
  .choice.correct{border-color:var(--correct);background:var(--correct-bg);}
  .choice.correct .letter{background:var(--correct);color:#fff;}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .choice.wrong .letter{background:var(--wrong);color:#fff;}
  .explain{
    margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);
    font-size:14px;line-height:1.6;border-left:3px solid var(--accent);
  }
  .explain b{font-weight:600;}
  .breakdown-row{display:flex;align-items:center;gap:10px;margin-top:9px;}
  .breakdown-label{font-size:13px;width:150px;flex:none;color:var(--ink-soft);}
  .breakdown-bar{flex:1;height:8px;background:var(--chip);border-radius:99px;overflow:hidden;}
  .breakdown-fill{height:100%;background:var(--correct);}
  .breakdown-fill.weak{background:var(--margin);}
  .breakdown-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);width:42px;text-align:right;flex:none;}
  .score-big{font-family:'Space Grotesk',sans-serif;font-size:44px;letter-spacing:-0.03em;}
  .score-sub{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .review-item{border-top:1px solid var(--line);padding:14px 0;}
  .review-item:first-of-type{border-top:none;}
  .review-q{font-size:14px;line-height:1.55;margin-bottom:6px;}
  .review-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 7px;border-radius:99px;}
  .review-tag.ok{background:var(--correct-bg);color:var(--correct);}
  .review-tag.no{background:var(--wrong-bg);color:var(--wrong);}
  .review-ans{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .history-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .history-row:first-of-type{border-top:none;}
  .empty-state{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px;}
  table.qtable{border-collapse:collapse;margin:14px 0;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  table.qtable th,table.qtable td{border:1px solid var(--grid);padding:6px 10px;text-align:center;}
  table.qtable th{background:var(--chip);font-weight:600;}
  .scroll-x{overflow-x:auto;}
  sup{font-size:.72em;}
  .note{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}
  a{color:var(--accent);}

  /* ---- typed answers ---- */
  .type-row{display:flex;gap:8px;margin-top:4px;}
  .type-input{
    flex:1;padding:13px 14px;border-radius:10px;border:1.5px solid var(--grid);
    font-family:'IBM Plex Mono',monospace;font-size:16px;background:var(--paper);color:var(--ink);
  }
  .type-input:focus{outline:none;border-color:var(--accent);}
  .type-input.ok{border-color:var(--correct);background:var(--correct-bg);}
  .type-input.no{border-color:var(--wrong);background:var(--wrong-bg);}
  .btn-check{
    padding:0 20px;border:none;border-radius:10px;background:var(--accent);color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  .verdict{margin-top:10px;font-size:14px;font-weight:600;}
  .verdict.ok{color:var(--correct);}
  .verdict.no{color:var(--wrong);}

  /* ---- dark theme ---- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151A18; --grid:#232B27; --paper:#1C2320; --ink:#E8EFE9; --ink-soft:#93A79C;
      --margin:#8C4A3E; --accent:#5FBF8F; --accent-soft:#1F3A2E;
      --correct:#5FBF8F; --correct-bg:#1E3A2C; --wrong:#E4796F; --wrong-bg:#3A2320;
      --chip:#26302B; --line:#2A332E;
    }
    :root:not([data-theme="light"]) .btn-primary,
    :root:not([data-theme="light"]) .btn-check{color:#10201A;}
    :root:not([data-theme="light"]) .page svg{background:#F7FAF7 !important;border-radius:10px;}
  }
  :root[data-theme="dark"]{
    --bg:#151A18;
    --grid:#232B27;
    --paper:#1C2320;
    --ink:#E8EFE9;
    --ink-soft:#93A79C;
    --margin:#8C4A3E;
    --accent:#5FBF8F;
    --accent-soft:#1F3A2E;
    --correct:#5FBF8F;
    --correct-bg:#1E3A2C;
    --wrong:#E4796F;
    --wrong-bg:#3A2320;
    --chip:#26302B;
    --line:#2A332E;
  }
  :root[data-theme="dark"] .btn-primary,:root[data-theme="dark"] .btn-check{color:#10201A;}
  :root[data-theme="dark"] svg{filter:invert(0);}
  :root[data-theme="dark"] .page svg{background:#F7FAF7 !important;border-radius:10px;}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ==================== Utilities ==================== */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b];}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function nonZero(min,max){let v=0;while(v===0)v=randInt(min,max);return v;}
function round(x,dp){const f=Math.pow(10,dp);return Math.round(x*f)/f;}
function fmt(x,dp){ if(dp===undefined) dp=2; const r=round(x,dp); return String(r); }
function sgn(n){return n<0?'− '+Math.abs(n):'+ '+n;}
function coef(n,v){ if(n===1) return v; if(n===-1) return '−'+v; return (n<0?'−'+Math.abs(n):String(n))+v; }
function term(n,v){ if(n===0) return ''; if(v==='') return constTerm(n); return (n>0?' + ':' − ')+(Math.abs(n)===1?v:Math.abs(n)+v); }
function constTerm(n){ if(n===0) return ''; return (n>0?' + ':' − ')+Math.abs(n); }
function poly(a,b,c,v){
  v=v||'x';
  let s=coef(a,v+'<sup>2</sup>');
  s+=term(b,v);
  if(c!==0) s+=(c>0?' + ':' − ')+Math.abs(c);
  return s;
}
function neg(n){return n<0?'('+n+')':String(n);}
function frac(n,d){const g=gcd(n,d);let nn=n/g,dd=d/g;if(dd<0){nn=-nn;dd=-dd;}return dd===1?String(nn):nn+'/'+dd;}
function simplifyFrac(n,d){const g=gcd(n,d);let nn=n/g,dd=d/g;if(dd<0){nn=-nn;dd=-dd;}return [nn,dd];}

/* Builds the multiple-choice object. Pads to four distinct options by nudging the
   correct value, so a generator never has to invent filler distractors itself. */
function extractNumberParts(str){
  const m=String(str).match(/-?\d+(\.\d+)?/);
  if(!m) return null;
  return {before:String(str).slice(0,m.index), numStr:m[0], after:String(str).slice(m.index+m[0].length)};
}
function numericVariant(str, offset){
  const parts=extractNumberParts(str);
  if(!parts) return null;
  const isDecimal=parts.numStr.includes('.');
  const decimals=isDecimal? parts.numStr.split('.')[1].length : 0;
  const newNum=parseFloat(parts.numStr)+offset;
  const newNumStr= decimals>0? newNum.toFixed(decimals) : String(Math.round(newNum));
  return parts.before+newNumStr+parts.after;
}
/* Canonical value of an answer string, used to guarantee that no distractor is
   mathematically EQUAL to the correct answer (the classic "1/2 vs 2/4" bug).
   Returns a comparable key: numbers compare by value, fractions by value,
   coordinate pairs and root-lists by their sorted numeric contents, and anything
   else by a whitespace/symbol-normalised string. */
function stripMarkup(s){
  return String(s)
    .replace(/<sup>([^<]*)<\/sup>/g,'^$1')
    .replace(/<sub>([^<]*)<\/sub>/g,'_$1')
    .replace(/<[^>]*>/g,'')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ')
    .replace(/[−–—]/g,'-')
    .replace(/×/g,'*').replace(/÷/g,'/')
    .trim();
}
function normText(s){ return stripMarkup(s).toLowerCase().replace(/\s+/g,''); }
function parseNumeric(tok){
  const t=String(tok).replace(/\s+/g,'');
  let m=t.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){ const d=parseFloat(m[2]); if(d===0) return null; return parseFloat(m[1])/d; }
  m=t.match(/^-?\d+(?:\.\d+)?$/);
  if(m) return parseFloat(t);
  return null;
}
function canonicalKey(str){
  const s=stripMarkup(str);
  const compact=s.replace(/\s+/g,'');
  /* coordinate pair, e.g. (2, -5) */
  let m=compact.match(/^\((-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)\)$/);
  if(m) return 'pt:'+parseFloat(m[1]).toFixed(6)+','+parseFloat(m[2]).toFixed(6);
  /* one or more "x = value" answers, in any order */
  const eqs=[...compact.matchAll(/([a-z](?:\^-?1)?)=(-?\d+(?:\.\d+)?(?:\/-?\d+(?:\.\d+)?)?)/g)];
  if(eqs.length && eqs.length*2>=compact.replace(/[^=]/g,'').length){
    const vals=eqs.map(e=>{ const v=parseNumeric(e[2]); return v===null?e[2]:v.toFixed(6); }).sort();
    return 'eq:'+eqs[0][1]+':'+vals.join('|');
  }
  /* bare value, optionally wrapped in a currency/unit label */
  const numMatch=compact.match(/^([^\d\-]*)(-?\d+(?:\.\d+)?(?:\/-?\d+(?:\.\d+)?)?)([^\d]*)$/);
  if(numMatch){
    const v=parseNumeric(numMatch[2]);
    if(v!==null){
      const unit=(numMatch[1]+numMatch[3]).toLowerCase().replace(/[^a-z%^0-9]/g,'');
      return 'num:'+unit+':'+v.toFixed(6);
    }
  }
  /* surd forms: k*sqrt(m) written as "6√2" */
  m=compact.match(/^(-?\d*)√(\d+)$/);
  if(m){
    const k=m[1]===''||m[1]==='-'? (m[1]+'1') : m[1];
    return 'surd:'+(parseFloat(k)*Math.sqrt(parseFloat(m[2]))).toFixed(6);
  }
  return 'str:'+compact.toLowerCase();
}
function finalize(topicLabel,subtopic,text,correctVal,distractorVals,explanation){
  const correctStr=String(correctVal);
  const correctKey=canonicalKey(correctStr);
  const seen=new Set([correctKey]);
  const uniq=[];
  (distractorVals||[]).forEach(d=>{
    const s=String(d);
    if(s===''||s==='NaN'||s==='undefined'||s==='null'||/NaN|undefined|Infinity/.test(s)) return;
    const k=canonicalKey(s);
    if(seen.has(k)) return;      /* equal in value to the answer, or to another option */
    seen.add(k); uniq.push(s);
  });
  /* Pad with value-shifted variants of the answer, still checking for collisions. */
  let offsetTry=1, guard=0;
  while(uniq.length<3 && guard<80){
    guard++;
    const sign=offsetTry%2===0?-1:1;
    const magnitude=Math.ceil(offsetTry/2);
    offsetTry++;
    let candidate=numericVariant(correctStr, sign*magnitude);
    if(candidate===null) continue;
    const fm=candidate.match(/^(-?\d+)\/(\d+)$/);          /* keep padded fractions in lowest terms */
    if(fm) candidate=frac(parseInt(fm[1],10),parseInt(fm[2],10));
    const k=canonicalKey(candidate);
    if(seen.has(k)||/NaN|undefined/.test(candidate)) continue;
    seen.add(k); uniq.push(candidate);
  }
  while(uniq.length<3){ const filler=correctStr+' '+'′'.repeat(uniq.length+1); uniq.push(filler); }
  const all=shuffle([correctStr,...uniq.slice(0,3)]);
  return {topic:topicLabel,subtopic,text,choices:all,correctIndex:all.indexOf(correctStr),explanation:explanation||''};
}

/* ==================== Diagram helpers (inline SVG) ==================== */
const SVG_INK='#1F2E28', SVG_SOFT='#5E7169', SVG_GRID='#E2EBE0', SVG_ACCENT='#2F7A5B', SVG_MARK='#C25E4E';
function svgWrap(width,height,inner,maxW){
  return '<svg viewBox="0 0 '+width+' '+height+'" width="100%" style="max-width:'+(maxW||330)+'px;height:auto;display:block;margin:14px auto;background:#fff;border-radius:10px;" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
}
function txt(x,y,s,opts){
  opts=opts||{};
  return '<text x="'+x+'" y="'+y+'" font-size="'+(opts.size||11)+'" fill="'+(opts.fill||SVG_SOFT)+'" text-anchor="'+(opts.anchor||'middle')+'" font-family="IBM Plex Mono, monospace">'+s+'</text>';
}
function pickNiceStep(range, targetLines){
  const raw = range / Math.max(1, targetLines);
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const norm = raw / mag;
  const niceNorm = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return niceNorm * mag;
}
/* Uses one shared pixels-per-unit scale on both axes when equalScale is on, so a
   drawn gradient matches its true gradient and squares stay square. */
function chartFrame(xMin,xMax,yMin,yMax,xStep,yStep,width,height,equalScale){
  width=width||320; height=height||250;
  const MAX_HEIGHT=330, MIN_PLOT_W=150;
  const m={left:34,right:14,top:14,bottom:28};
  const availW=width-m.left-m.right, availH0=height-m.top-m.bottom;
  const xRange=xMax-xMin, yRange=yMax-yMin;
  equalScale = equalScale!==false;
  let scaleX,scaleY,pw,ph,finalWidth,finalHeight,scale;
  if(equalScale){
    scale=availW/xRange;
    finalHeight=Math.round(yRange*scale+m.top+m.bottom);
    if(finalHeight>MAX_HEIGHT){ scale=(MAX_HEIGHT-m.top-m.bottom)/yRange; finalHeight=MAX_HEIGHT; }
    pw=xRange*scale;
    if(pw<MIN_PLOT_W){ scale=MIN_PLOT_W/xRange; pw=MIN_PLOT_W; finalHeight=Math.round(yRange*scale+m.top+m.bottom); }
    ph=yRange*scale; finalWidth=Math.round(pw+m.left+m.right); scaleX=scale; scaleY=scale;
  }else{
    pw=availW; ph=availH0; scaleX=pw/xRange; scaleY=ph/yRange; finalWidth=width; finalHeight=height;
  }
  function toPx(x,y){ return {x:m.left+(x-xMin)*scaleX, y:m.top+ph-(y-yMin)*scaleY}; }
  const autoXStep = xStep || pickNiceStep(xRange, Math.max(2, pw/48));
  const autoYStep = yStep || pickNiceStep(yRange, Math.max(2, ph/34));
  let grid='';
  for(let gx=Math.ceil(xMin/autoXStep)*autoXStep; gx<=xMax+1e-6; gx+=autoXStep){
    const p=toPx(gx,yMin);
    grid+='<line x1="'+p.x+'" y1="'+m.top+'" x2="'+p.x+'" y2="'+(m.top+ph)+'" stroke="'+SVG_GRID+'" stroke-width="1"/>';
    grid+=txt(p.x, m.top+ph+16, Math.round(gx*100)/100, {size:9});
  }
  for(let gy=Math.ceil(yMin/autoYStep)*autoYStep; gy<=yMax+1e-6; gy+=autoYStep){
    const p=toPx(xMin,gy);
    grid+='<line x1="'+m.left+'" y1="'+p.y+'" x2="'+(m.left+pw)+'" y2="'+p.y+'" stroke="'+SVG_GRID+'" stroke-width="1"/>';
    grid+=txt(m.left-6, p.y+3, Math.round(gy*100)/100, {size:9, anchor:'end'});
  }
  let axes='';
  if(0>=xMin&&0<=xMax){ const px=toPx(0,yMin); axes+='<line x1="'+px.x+'" y1="'+m.top+'" x2="'+px.x+'" y2="'+(m.top+ph)+'" stroke="'+SVG_INK+'" stroke-width="1.5"/>'; }
  if(0>=yMin&&0<=yMax){ const py=toPx(xMin,0); axes+='<line x1="'+m.left+'" y1="'+py.y+'" x2="'+(m.left+pw)+'" y2="'+py.y+'" stroke="'+SVG_INK+'" stroke-width="1.5"/>'; }
  const border='<rect x="'+m.left+'" y="'+m.top+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="'+SVG_GRID+'" stroke-width="1"/>';
  return {toPx, width:finalWidth, height:finalHeight, svgBase:border+grid+axes, margin:m, plotW:pw, plotH:ph, scaleX, scaleY};
}
/* Draws y = fn(x) as an SVG path, breaking the path wherever the curve leaves the
   plotted window. Without the break, an off-screen section gets joined by a straight
   line and the drawn graph no longer matches its equation. */
function plotCurve(f,fn,xMin,xMax,yMin,yMax,step){
  step=step||(xMax-xMin)/200;
  let d='', pen=false;
  for(let x=xMin; x<=xMax+1e-9; x+=step){
    const y=fn(x);
    if(!isFinite(y)||y<yMin||y>yMax){ pen=false; continue; }
    const p=f.toPx(x,y);
    d+=(pen?'L ':'M ')+p.x.toFixed(2)+' '+p.y.toFixed(2)+' ';
    pen=true;
  }
  return d;
}
function polarToCartesian(cx,cy,r,angleDeg){
  const rad=(angleDeg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)};
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start=polarToCartesian(cx,cy,r,endAngle);
  const end=polarToCartesian(cx,cy,r,startAngle);
  const largeArcFlag = endAngle-startAngle <= 180 ? '0':'1';
  return 'M '+cx+' '+cy+' L '+start.x+' '+start.y+' A '+r+' '+r+' 0 '+largeArcFlag+' 0 '+end.x+' '+end.y+' Z';
}
function rightTriangleSVG(labels){
  /* labels: {base, height, hyp, angle} — any may be a string or null.
     Right angle at the bottom-left; the marked angle (if any) is at the
     bottom-right vertex, which is the angle the trig labels refer to. */
  const x0=54,y0=168,w=186,h=112;
  let s='<polygon points="'+x0+','+y0+' '+(x0+w)+','+y0+' '+x0+','+(y0-h)+'" fill="#F4F9F3" stroke="'+SVG_INK+'" stroke-width="1.6"/>';
  s+='<path d="M '+(x0+13)+' '+y0+' L '+(x0+13)+' '+(y0-13)+' L '+x0+' '+(y0-13)+'" fill="none" stroke="'+SVG_SOFT+'" stroke-width="1.2"/>';
  if(labels.base) s+=txt(x0+w/2, y0+19, labels.base, {fill:SVG_INK});
  if(labels.height) s+=txt(x0-9, y0-h/2+4, labels.height, {fill:SVG_INK, anchor:'end'});
  /* the hypotenuse label sits just outside the sloped side, not inside the shape */
  if(labels.hyp) s+=txt(x0+w/2+30, y0-h/2-14, labels.hyp, {fill:SVG_INK});
  if(labels.angle){
    const vx=x0+w, vy=y0, r=30;
    const ax=Math.atan2(h,w);                      /* the sloped side rises to the left */
    s+='<path d="M '+(vx-r)+' '+vy+' A '+r+' '+r+' 0 0 1 '+(vx-r*Math.cos(ax))+' '+(vy-r*Math.sin(ax))+'" fill="none" stroke="'+SVG_MARK+'" stroke-width="1.4"/>';
    s+=txt(vx-46, vy-11, labels.angle, {fill:SVG_MARK});
  }
  return svgWrap(292,198,s,300);
}
function barChartSVG(cats,vals,ylabel){
  const W=320,H=210,left=38,bottom=34,top=14,right=10;
  const max=Math.max(...vals), step=pickNiceStep(max,4);
  const yMax=Math.ceil(max/step)*step;
  const pw=W-left-right, ph=H-top-bottom;
  let s='';
  for(let g=0; g<=yMax+1e-9; g+=step){
    const y=top+ph-(g/yMax)*ph;
    s+='<line x1="'+left+'" y1="'+y+'" x2="'+(left+pw)+'" y2="'+y+'" stroke="'+SVG_GRID+'"/>'+txt(left-6,y+3,g,{size:9,anchor:'end'});
  }
  const bw=pw/cats.length;
  cats.forEach((c,i)=>{
    const bh=(vals[i]/yMax)*ph;
    s+='<rect x="'+(left+i*bw+bw*0.18)+'" y="'+(top+ph-bh)+'" width="'+(bw*0.64)+'" height="'+bh+'" fill="'+SVG_ACCENT+'" opacity="0.8"/>';
    s+=txt(left+i*bw+bw/2, top+ph+15, c, {size:9});
  });
  s+='<line x1="'+left+'" y1="'+(top+ph)+'" x2="'+(left+pw)+'" y2="'+(top+ph)+'" stroke="'+SVG_INK+'" stroke-width="1.4"/>';
  s+='<line x1="'+left+'" y1="'+top+'" x2="'+left+'" y2="'+(top+ph)+'" stroke="'+SVG_INK+'" stroke-width="1.4"/>';
  if(ylabel) s+=txt(left,top-3,ylabel,{size:9,anchor:'start'});
  return svgWrap(W,H,s);
}

function genRoundingSF(){
  const mode=choice(['dp','sf']);
  if(mode==='dp'){
    /* the raw value must have more decimals than we round to, or there is nothing to do */
    let thousandths=randInt(1000,999999);
    if(thousandths%10===0) thousandths+=randInt(1,9);
    const raw=thousandths/1000;
    const places=choice([1,2]);
    const correct=raw.toFixed(places);
    const distractors=[raw.toFixed(places===1?2:1),(raw+(places===1?0.1:0.01)).toFixed(places),String(Math.floor(raw))];
    return finalize('Number','roundingSigFig','Round <span class="num">'+raw+'</span> to '+places+' decimal place'+(places>1?'s':'')+'.',correct,distractors,
      'Look at the digit in the next decimal place. If it is 5 or more, round up. Answer: <b>'+correct+'</b>.');
  }
  const raw=randInt(1000,98765);
  const sf=choice([1,2,3]);
  function roundSF(n,sig){ if(n===0)return 0; const d=Math.ceil(Math.log10(Math.abs(n))+1e-9); const p=Math.pow(10,sig-d); return Math.round(n*p)/p; }
  const correct=roundSF(raw,sf);
  if(correct===raw) return genRoundingSF();   /* already at that many significant figures */
  return finalize('Number','roundingSigFig','Round <span class="num">'+raw+'</span> to '+sf+' significant figure'+(sf>1?'s':'')+'.',correct,
    [roundSF(raw,sf+1),roundSF(raw,Math.max(1,sf-1)),raw],
    'Count '+sf+' significant figure'+(sf>1?'s':'')+' from the first non-zero digit, then round and fill with zeros: <b>'+correct+'</b>.');
}

}
function genHCFLCM(){
  const primes=[2,3,5,7];
  const shared=choice(primes)*choice([1,choice(primes)]);
  const p=shuffle(primes);
  const a=shared*p[0], b=shared*p[1];
  if(a===b) return genHCFLCM();
  const want=choice(['HCF','LCM']);
  const correct= want==='HCF'? gcd(a,b) : lcm(a,b);
  const other= want==='HCF'? lcm(a,b) : gcd(a,b);
  return finalize('Number','primeFactorsHCFLCM','Find the '+want+' of <span class="num">'+a+'</span> and <span class="num">'+b+'</span>.',correct,
    [other,a*b,Math.abs(a-b)],
    'Write each as a product of primes. HCF = '+gcd(a,b)+', LCM = '+lcm(a,b)+'. The '+want+' is <b>'+correct+'</b>.');
}

function genStandardFormCalc(){
  const a=randInt(2,9), b=randInt(2,9);

  if(op==='mul'){ mant=a*b; pow=m+n; } else { mant=a*b/b; mant=a/b; pow=m-n; }
  if(op==='div'){ mant=a/b; }

    mStr=String(round(mant,3));

  const correct=mStr+' × 10<sup>'+pStr+'</sup>';
  const symbol= op==='mul'?'×':'÷';
  return finalize('Number','standardFormCalc','Work out <span class="num">('+a+' × 10<sup>'+m+'</sup>) '+symbol+' ('+b+' × 10<sup>'+n+'</sup>)</span>. Give your answer in standard form.',correct,
    [mStr+' × 10<sup>'+(op==='mul'?m+n:m+n)+'</sup>', (op==='mul'?a*b:round(a/b,3))+' × 10<sup>'+(op==='mul'?m+n:m-n)+'</sup>', mStr+' × 10<sup>'+(pStr+1)+'</sup>'],

function genFractionArith(){
  const type=choice(['add','sub','mul','div']);
  let d1=randInt(2,9), n1=randInt(1,d1-1);
  let d2=randInt(2,9), n2=randInt(1,d2-1);
  let num,den,text,working,wrong;
  if(type==='add'||type==='sub'){
    const l=lcm(d1,d2);
    num= type==='add'? n1*(l/d1)+n2*(l/d2) : n1*(l/d1)-n2*(l/d2);
    if(type==='sub'&&num<=0) return genFractionArith();
    den=l;
    text='Work out <span class="num">'+n1+'/'+d1+' '+(type==='add'?'+':'−')+' '+n2+'/'+d2+'</span>. Give your answer in its simplest form.';
    working='Use a common denominator of '+l+': '+(n1*(l/d1))+'/'+l+' '+(type==='add'?'+':'−')+' '+(n2*(l/d2))+'/'+l+' = '+num+'/'+l+'.';
    /* classic error: add or subtract tops and bottoms separately */
    wrong=[frac(type==='add'?n1+n2:Math.abs(n1-n2), type==='add'?d1+d2:Math.abs(d1-d2)||1), frac(num+1,den), frac(n1*n2,d1*d2)];
  }else if(type==='mul'){
    num=n1*n2; den=d1*d2;
    text='Work out <span class="num">'+n1+'/'+d1+' × '+n2+'/'+d2+'</span>. Give your answer in its simplest form.';
    working='Multiply the numerators and the denominators: '+num+'/'+den+'.';
    /* classic error: cross-multiply, or add instead */
    wrong=[frac(n1*d2,d1*n2), frac(n1+n2,d1+d2), frac(num+1,den)];
  }else{
    num=n1*d2; den=d1*n2;
    text='Work out <span class="num">'+n1+'/'+d1+' ÷ '+n2+'/'+d2+'</span>. Give your answer in its simplest form.';
    working='Turn the second fraction upside down and multiply: '+n1+'/'+d1+' × '+d2+'/'+n2+' = '+num+'/'+den+'.';
    /* classic error: forget to flip */
    wrong=[frac(n1*n2,d1*d2), frac(d1*n2,n1*d2), frac(num+1,den)];
  }
  const correct=frac(num,den);
  return finalize('Number','fractions',text,correct,wrong,
    working+' In its simplest form that is <b>'+correct+'</b>.');
}

function genCompoundGrowth(){
  const kind=choice(['interest','depreciation','population']);
  const principal=choice([1000,2000,2500,4000,5000,8000,10000]);
  const rate=choice([2,3,4,5,8,10]);
  const years=randInt(2,5);
  const mult= kind==='depreciation'? 1-rate/100 : 1+rate/100;
  const exact=principal*Math.pow(mult,years);
  const correct='AED '+exact.toFixed(2);
  const simple= kind==='depreciation'? principal-principal*rate/100*years : principal+principal*rate/100*years;
  const story= kind==='interest'? 'AED '+principal+' is invested at <span class="num">'+rate+'%</span> compound interest per year.'
    : kind==='depreciation'? 'A car worth AED '+principal+' loses <span class="num">'+rate+'%</span> of its value each year.'
    : 'An investment of AED '+principal+' grows by <span class="num">'+rate+'%</span> each year.';
  return finalize('Number','compoundGrowth',story+' What is it worth after <span class="num">'+years+' years</span>? Give your answer to 2 decimal places.',correct,
    ['AED '+simple.toFixed(2),'AED '+(principal*mult).toFixed(2),'AED '+(principal*Math.pow(mult,years+1)).toFixed(2)],
    'Use the multiplier '+mult+' once per year: '+principal+' × '+mult+'<sup>'+years+'</sup> = <b>'+correct+'</b>. Simple interest would give a different (wrong) answer here.');
}

  const val= dp===0? randInt(12,89) : randInt(120,890)/10;
  const half= dp===0? 0.5 : 0.05;
  const lo=round(val-half,3), hi=round(val+half,3);
  const correct=lo+' ≤ x &lt; '+hi;
  const unitTxt= dp===0? 'the nearest whole number' : '1 decimal place';
  return finalize('Number','errorInterval','A number <span class="num">x</span> is <span class="num">'+val+'</span> rounded to '+unitTxt+'. Write down the error interval for x.',correct,
    [lo+' ≤ x ≤ '+hi, (val-half*2)+' ≤ x &lt; '+(val+half*2), lo+' &lt; x ≤ '+hi],
    'The value could be up to '+half+' either side. The lower bound is included but the upper bound is not: <b>'+correct+'</b>.');
}
function genBoundsCalc(){
  const L=randInt(6,19), W=randInt(3,9);
  const which=choice(['upper','lower']);
  const lb=(x)=>x-0.5, ub=(x)=>x+0.5;

  return finalize('Number','bounds',
    'A rectangle measures <span class="num">'+L+' cm</span> by <span class="num">'+W+' cm</span>, each to the nearest cm. Find the '+which+' bound of its area, in cm<sup>2</sup>.',correct,
    [L*W, round(which==='upper'?lb(L)*lb(W):ub(L)*ub(W),2), round((L+0.5)*W,2)],
    'The '+which+' bound of the area uses the '+which+' bound of each length: '+(which==='upper'?ub(L)+' × '+ub(W):lb(L)+' × '+lb(W))+' = <b>'+correct+' cm<sup>2</sup></b>.');
}
function genProductRuleCounting(){
  const a=randInt(3,6), b=randInt(3,7), c=randInt(2,4);
  const correct=a*b*c;
  return finalize('Number','productRule',
    'A restaurant menu offers <span class="num">'+a+'</span> starters, <span class="num">'+b+'</span> main courses and <span class="num">'+c+'</span> desserts. How many different three-course meals are possible?',correct,

/* ==================== 2. Algebra ==================== */
function brk(p,v){ v=v||'x'; return p>=0? '('+v+' + '+p+')' : '('+v+' − '+Math.abs(p)+')'; }
function brkA(a,p,v){ v=v||'x'; const lead=(a===1?v:a+v); return p>=0? '('+lead+' + '+p+')' : '('+lead+' − '+Math.abs(p)+')'; }
function genSimplifyExpr(){
  const a=randInt(2,9), b=randInt(2,9), c=randInt(2,7), d=randInt(2,7);
  const x=a+b, y=c-d;
  if(y===0) return genSimplifyExpr();
  const correct=coef(x,'a')+term(y,'b');
  return finalize('Algebra','simplify','Simplify <span class="num">'+a+'a + '+c+'b + '+b+'a − '+d+'b</span>.',correct,
    [coef(a+b+c-d,'a'),coef(x,'a')+term(-y,'b'),coef(x,'ab')],
    'Collect like terms: '+a+'a + '+b+'a = '+x+'a, and '+c+'b − '+d+'b = '+y+'b. Answer: <b>'+correct+'</b>.');
}
function genSubstitution(){
  const a=randInt(2,6), b=nonZero(-6,6), x=nonZero(-5,6);
  const correct=a*x*x+b*x;
  return finalize('Algebra','substitution','If <span class="num">y = '+a+'x<sup>2</sup> '+sgn(b)+'x</span>, work out the value of y when <span class="num">x = '+x+'</span>.',correct,
    [a*x*2+b*x, Math.pow(a*x,2)+b*x, a*x*x-b*x],
    'Square first, then multiply: '+a+'×('+x+')<sup>2</sup> = '+(a*x*x)+', and '+b+'×('+x+') = '+(b*x)+'. Total = <b>'+correct+'</b>.');
}
function genExpandSingle(){
  const k=randInt(2,8), a=randInt(2,9), b=nonZero(-9,9);
  const correct=coef(k*a,'x')+term(k*b,'');
  const corr=(k*a)+'x'+(k*b>0?' + '+(k*b):' − '+Math.abs(k*b));
  return finalize('Algebra','expandSingle','Expand <span class="num">'+k+'('+a+'x '+sgn(b)+')</span>.',corr,
    [(k*a)+'x '+sgn(b), (a)+'x '+sgn(k*b), (k*a)+'x '+sgn(-k*b)],
    'Multiply <i>both</i> terms by '+k+': '+k+'×'+a+'x = '+(k*a)+'x and '+k+'×'+neg(b)+' = '+(k*b)+'.');
}
function genExpandDouble(){
  const p=nonZero(-7,7), q=nonZero(-7,7);
  const b=p+q, c=p*q;
  const correct=poly(1,b,c,'x');
  return finalize('Algebra','expandDouble','Expand and simplify <span class="num">'+brk(p)+brk(q)+'</span>.',correct,
    [poly(1,p*q,p+q,'x'), poly(1,b,-c,'x'), poly(1,0,c,'x')],
    'Use FOIL: x<sup>2</sup> '+sgn(q)+'x '+sgn(p)+'x + ('+p+'×'+neg(q)+') = <b>'+correct+'</b>.');
}
function genExpandTriple(){
  const p=nonZero(-4,4), q=nonZero(-4,4), r=nonZero(-4,4);
  const b=p+q+r, c=p*q+p*r+q*r, d=p*q*r;
  let correct='x<sup>3</sup>'+term(b,'x<sup>2</sup>')+term(c,'x');
  if(d!==0) correct+=(d>0?' + ':' − ')+Math.abs(d);
  return finalize('Algebra','expandTriple','Expand and simplify <span class="num">'+brk(p)+brk(q)+brk(r)+'</span>.',correct,
    ['x<sup>3</sup>'+term(b,'x<sup>2</sup>')+term(c,'x')+(d>0?' − ':' + ')+Math.abs(d),
     'x<sup>3</sup>'+term(c,'x<sup>2</sup>')+term(b,'x')+(d>0?' + ':' − ')+Math.abs(d),
     'x<sup>3</sup>'+term(b,'x<sup>2</sup>')+(d>0?' + ':' − ')+Math.abs(d)],
    'Expand two brackets first, then multiply by the third and collect like terms: <b>'+correct+'</b>.');
}
function genFactorizeCommon(){
  const k=randInt(2,8), a=randInt(2,7), b=randInt(2,9);
  /* a and b must be coprime, or k x is not the HCF and the answer is not "fully" factorized */
  if(gcd(a,b)!==1) return genFactorizeCommon();
  const correct=k+'x('+a+'x + '+b+')';
  return finalize('Algebra','factorizeCommon','Factorize fully <span class="num">'+(k*a)+'x<sup>2</sup> + '+(k*b)+'x</span>.',correct,
    ['x('+(k*a)+'x + '+(k*b)+')', k+'('+a+'x<sup>2</sup> + '+b+'x)', 'x('+(k*a)+'x + '+b+')'],
    'The highest common factor of '+(k*a)+'x<sup>2</sup> and '+(k*b)+'x is '+k+'x. Taking it out gives <b>'+correct+'</b>.');
}
function genFactorizeQuadratic(){
  const p=nonZero(-8,8), q=nonZero(-8,8);
  const b=p+q, c=p*q;
  const correct=brk(p)+brk(q);
  return finalize('Algebra','factorizeQuadratic','Factorize <span class="num">'+poly(1,b,c,'x')+'</span>.',correct,
    [brk(-p)+brk(-q), brk(b)+brk(c), brk(p)+brk(-q)],
    'Find two numbers that multiply to '+c+' and add to '+b+': '+p+' and '+q+'. So the answer is <b>'+correct+'</b>.');
}
function genFactorizeQuadraticHard(){
  const a=choice([2,3,5]);
  const p=nonZero(-5,5), q=nonZero(-5,5);
  /* (a x + p)(x + q) = a x^2 + (aq + p) x + pq */
  const b=a*q+p, c=p*q;
  const correct=brkA(a,p)+brk(q);
  return finalize('Algebra','factorizeQuadraticHard','Factorize <span class="num">'+poly(a,b,c,'x')+'</span>.',correct,
    [brkA(a,q)+brk(p), brkA(a,-p)+brk(-q), brk(p)+brk(q)],
    'Find two numbers multiplying to '+(a*c)+' and adding to '+b+', split the middle term, then factorize in pairs. Answer: <b>'+correct+'</b>.');
}
function genDOTS(){
  const a=choice([1,2,3,4,5]), b=randInt(2,9);
  /* a common factor would mean the answer is not fully factorized, e.g. 4x^2 - 36 */
  if(gcd(a,b)!==1) return genDOTS();
  const correct= a===1? '(x + '+b+')(x − '+b+')' : '('+a+'x + '+b+')('+a+'x − '+b+')';
  const lead= a===1? 'x<sup>2</sup>' : (a*a)+'x<sup>2</sup>';
  return finalize('Algebra','differenceOfSquares','Factorize <span class="num">'+lead+' − '+(b*b)+'</span>.',correct,
    [(a===1?'(x − '+b+')<sup>2</sup>':'('+a+'x − '+b+')<sup>2</sup>'),
     (a===1?'(x + '+b+')<sup>2</sup>':'('+a+'x + '+b+')<sup>2</sup>'),
     (a===1?'(x + '+(b*b)+')(x − 1)':'('+a+'x + '+(b*b)+')(x − 1)')],
    'This is the difference of two squares: '+lead+' − '+(b*b)+' = <b>'+correct+'</b>.');
}
function genSolveLinear(){
  const a=randInt(2,9), x=nonZero(-9,12), b=nonZero(-20,20);
  const rhs=a*x+b;
  return finalize('Algebra','solveLinear','Solve <span class="num">'+a+'x '+sgn(b)+' = '+rhs+'</span>.','x = '+x,
    ['x = '+round(rhs/a,2),'x = '+(rhs+b),'x = '+(x+1)],
    (b>0?'Subtract '+b:'Add '+Math.abs(b))+' from both sides to get '+a+'x = '+(a*x)+', then divide by '+a+': <b>x = '+x+'</b>.');
}
function genSolveBothSides(){
  const x=nonZero(-8,9);
  const a=randInt(3,9), b=randInt(2,a-1), c=nonZero(-15,15);
  const d=(a-b)*x+c;
  return finalize('Algebra','solveBothSides','Solve <span class="num">'+a+'x '+sgn(c)+' = '+b+'x + '+d+'</span>.','x = '+x,
    ['x = '+round(d/(a-b),2),'x = '+(-x),'x = '+round((d+c)/(a+b),2)],
    'Subtract '+b+'x from both sides: '+(a-b)+'x '+sgn(c)+' = '+d+'. Then solve: <b>x = '+x+'</b>.');
}
function genInequalities(){
  const a=randInt(2,7), b=nonZero(-12,12), x=nonZero(-6,9);
  const rhs=a*x+b;
  const sym=choice(['&lt;','&gt;','≤','≥']);
  const correct='x '+sym+' '+x;
  const flip= sym==='&lt;'?'&gt;': sym==='&gt;'?'&lt;': sym==='≤'?'≥':'≤';
  return finalize('Algebra','inequalities','Solve the inequality <span class="num">'+a+'x '+sgn(b)+' '+sym+' '+rhs+'</span>.',correct,
    ['x '+flip+' '+x,'x '+sym+' '+round(rhs/a,2),'x '+sym+' '+(x+1)],
    'Solve it exactly like an equation: '+a+'x '+sym+' '+(a*x)+', so <b>'+correct+'</b>. (The sign only flips if you multiply or divide by a negative.)');
}
function genRearrangeFormula(){
  const type=choice(['linear','root','divide']);
  if(type==='linear'){
    const a=randInt(2,7), b=randInt(2,9);
    return finalize('Algebra','rearrange','Make <span class="num">x</span> the subject of <span class="num">y = '+a+'x + '+b+'</span>.','x = (y − '+b+') / '+a,
      ['x = y/'+a+' − '+b,'x = (y + '+b+') / '+a,'x = '+a+'y − '+b],
      'Subtract '+b+' from both sides, then divide by '+a+': <b>x = (y − '+b+')/'+a+'</b>.');
  }
  if(type==='root'){
    const a=randInt(2,6);
    return finalize('Algebra','rearrange','Make <span class="num">r</span> the subject of <span class="num">A = '+a+'πr<sup>2</sup></span>.','r = √(A / '+a+'π)',
      ['r = A / '+a+'π','r = √(A) / '+a+'π','r = '+a+'π / √A'],
      'Divide both sides by '+a+'π, then take the square root: <b>r = √(A/'+a+'π)</b>.');
  }
  const a=randInt(2,7), b=randInt(2,9);
  return finalize('Algebra','rearrange','Make <span class="num">x</span> the subject of <span class="num">y = (x + '+b+') / '+a+'</span>.','x = '+a+'y − '+b,

    'Multiply both sides by '+a+' first: '+a+'y = x + '+b+'. Then subtract '+b+': <b>x = '+a+'y − '+b+'</b>.');

function genRearrangeTwice(){
  const a=randInt(2,5), b=randInt(2,7);
  return finalize('Algebra','rearrangeTwice','Make <span class="num">x</span> the subject of <span class="num">y = ('+a+'x + '+b+') / (x − 1)</span>.',
    'x = (y + '+b+') / (y − '+a+')',
    ['x = (y − '+b+') / (y + '+a+')','x = (y + '+b+') / (y + '+a+')','x = ('+a+' − y) / (y + '+b+')'],
    'Multiply out: y(x − 1) = '+a+'x + '+b+', so yx − y = '+a+'x + '+b+'. Collect the x terms on one side: x(y − '+a+') = y + '+b+'. Then divide: <b>x = (y + '+b+')/(y − '+a+')</b>.');
}
function genSimultaneous(){
  const x=nonZero(-6,8), y=nonZero(-6,8);
  const a=randInt(1,5), b=randInt(1,5), c=randInt(1,5), d=nonZero(-5,5);
  if(a*d-b*c===0) return genSimultaneous();
  const e=a*x+b*y, f=c*x+d*y;
  const eq1=coef(a,'x')+term(b,'y')+' = '+e;
  const eq2=coef(c,'x')+term(d,'y')+' = '+f;
  return finalize('Algebra','simultaneous','Solve the simultaneous equations:<br><span class="num">'+eq1+'</span><br><span class="num">'+eq2+'</span>','x = '+x+', y = '+y,
    ['x = '+y+', y = '+x,'x = '+(x+1)+', y = '+(y-1),'x = '+(-x)+', y = '+(-y)],
    'Multiply the equations so one variable matches, then add or subtract to eliminate it. Solution: <b>x = '+x+', y = '+y+'</b>. Check both equations to be sure.');
}
function genSolveQuadFactorize(){
  const p=nonZero(-8,8), q=nonZero(-8,8);
  if(p===q) return genSolveQuadFactorize();
  const b=p+q, c=p*q;
  const roots=[-p,-q].sort((m,n)=>m-n);
  const correct='x = '+roots[0]+' or x = '+roots[1];
  return finalize('Algebra','solveQuadratic','Solve <span class="num">'+poly(1,b,c,'x')+' = 0</span>.',correct,
    ['x = '+p+' or x = '+q,'x = '+roots[0]+' or x = '+(roots[1]+1),'x = '+(-roots[0])+' or x = '+roots[1]],
    'Factorize to '+brk(p)+brk(q)+' = 0. Each bracket can be zero, so <b>'+correct+'</b>. (Watch the signs — the roots are the <i>opposite</i> of the numbers in the brackets.)');
}
function genQuadraticFormula(){
  const a=choice([1,1,2]), b=nonZero(-9,9), c=nonZero(-9,9);
  const disc=b*b-4*a*c;
  if(disc<=0 || Number.isInteger(Math.sqrt(disc))) return genQuadraticFormula();
  const r1=(-b+Math.sqrt(disc))/(2*a);
  const correct=r1.toFixed(2);
  return finalize('Algebra','quadraticFormula',
    'Solve <span class="num">'+poly(a,b,c,'x')+' = 0</span> using the quadratic formula. Give the <b>larger</b> root to 2 decimal places.',correct,
    [((-b-Math.sqrt(disc))/(2*a)).toFixed(2), ((-b+Math.sqrt(disc))/a).toFixed(2), ((b+Math.sqrt(disc))/(2*a)).toFixed(2)],
    'x = (−b ± √(b<sup>2</sup> − 4ac)) / 2a with a = '+a+', b = '+b+', c = '+c+'. The discriminant is '+disc+', so the larger root is <b>'+correct+'</b>.');
}
function genCompleteSquare(){
  const h=nonZero(-7,7);
  const b=2*h, c=nonZero(-12,12);
  const k=c-h*h;
  const correct=brk(h)+'<sup>2</sup> '+(k>=0?'+ '+k:'− '+Math.abs(k));
  return finalize('Algebra','completeSquare','Write <span class="num">'+poly(1,b,c,'x')+'</span> in the form (x + a)<sup>2</sup> + b.',correct,
    [brk(h)+'<sup>2</sup> '+(k>=0?'− '+k:'+ '+Math.abs(k)), brk(b)+'<sup>2</sup> '+(k>=0?'+ '+k:'− '+Math.abs(k)), brk(h)+'<sup>2</sup> '+(c>=0?'+ '+c:'− '+Math.abs(c))],
    'Halve the x-coefficient: '+b+' ÷ 2 = '+h+'. Then '+brk(h)+'<sup>2</sup> = x<sup>2</sup> '+sgn(b)+'x + '+(h*h)+', so you must adjust by '+c+' − '+(h*h)+' = '+k+'. Answer: <b>'+correct+'</b>. (The minimum point is at ('+(-h)+', '+k+').)');
}
function genSequencesLinear(){
  const a=nonZero(-6,9), d=nonZero(-7,9);
  const terms=[0,1,2,3,4].map(i=>a+d*i);
  const correct=coef(d,'n')+(a-d===0?'':(a-d>0?' + '+(a-d):' − '+Math.abs(a-d)));
  return finalize('Algebra','sequencesLinear','Find the nth term of the sequence <span class="num">'+terms.join(', ')+', …</span>',correct,
    [coef(a,'n')+constTerm(d), coef(-d,'n')+constTerm(a-d), coef(d,'n')+constTerm(a-d+1), coef(d,'n')+constTerm(a-d-1), coef(d+1,'n')+constTerm(a-d)],
    'The common difference is '+d+', so the nth term starts '+d+'n. Since '+d+'×1 = '+d+' but the first term is '+a+', adjust by '+(a-d)+'. Answer: <b>'+correct+'</b>.');
}
function genSequencesQuadratic(){
  const a=choice([1,2,3]), b=nonZero(-4,5), c=nonZero(-6,8);
  const terms=[1,2,3,4,5].map(n=>a*n*n+b*n+c);
  let correct= (a===1?'n<sup>2</sup>':a+'n<sup>2</sup>');
  correct+=term(b,'n');
  if(c!==0) correct+=(c>0?' + '+c:' − '+Math.abs(c));
  return finalize('Algebra','sequencesQuadratic','Find the nth term of the quadratic sequence <span class="num">'+terms.join(', ')+', …</span>',correct,
    [(a===1?'n<sup>2</sup>':a+'n<sup>2</sup>')+term(c,'n')+(b!==0?(b>0?' + '+b:' − '+Math.abs(b)):''),
     ((2*a)===1?'n<sup>2</sup>':(2*a)+'n<sup>2</sup>')+term(b,'n')+(c!==0?(c>0?' + '+c:' − '+Math.abs(c)):''),
     (a===1?'n<sup>2</sup>':a+'n<sup>2</sup>')+term(-b,'n')+(c!==0?(c>0?' + '+c:' − '+Math.abs(c)):'')],
    'The second difference is '+(2*a)+', so the n<sup>2</sup> coefficient is '+(2*a)+' ÷ 2 = '+a+'. Subtract '+(a===1?'n<sup>2</sup>':a+'n<sup>2</sup>')+' from each term and find the linear nth term of what is left. Answer: <b>'+correct+'</b>.');
}
function genGeometricSequence(){
  const a=randInt(2,6), r=choice([2,3,4,0.5]);
  const n=randInt(5,7);   /* four terms are shown, so ask beyond them */
  const terms=[0,1,2,3].map(i=>round(a*Math.pow(r,i),3));

    'Each term is multiplied by '+r+'. The '+n+'th term is '+a+' × '+r+'<sup>'+(n-1)+'</sup> = <b>'+correct+'</b>.');
}
function genArithmeticSeries(){
  const a=randInt(2,12), d=randInt(2,9), n=choice([10,12,15,20,25,30]);
  const S=n/2*(2*a+(n-1)*d);
  return finalize('Algebra','arithmeticSeries',
    'An arithmetic series has first term <span class="num">'+a+'</span> and common difference <span class="num">'+d+'</span>. Find the sum of the first <span class="num">'+n+'</span> terms.',S,
    [n/2*(2*a+n*d), a+(n-1)*d, n*(a+d)],
    'S<sub>n</sub> = n/2 [2a + (n − 1)d] = '+n+'/2 × [2×'+a+' + '+(n-1)+'×'+d+'] = '+(n/2)+' × '+(2*a+(n-1)*d)+' = <b>'+S+'</b>.');
}
function genFunctionNotation(){

  const a=randInt(2,6), b=nonZero(-8,8);
  if(kind==='evaluate'){
    const x=nonZero(-5,7);

    return finalize('Algebra','functions','Given <span class="num">f(x) = '+a+'x<sup>2</sup> '+sgn(b)+'</span>, work out <span class="num">f('+x+')</span>.',correct,
      [Math.pow(a*x,2)+b, a*x+b, a*x*x-b],
      'Substitute x = '+x+': '+a+'×('+x+')<sup>2</sup> '+sgn(b)+' = '+(a*x*x)+' '+sgn(b)+' = <b>'+correct+'</b>.');
  }
  if(kind==='composite'){

  }

/* ==================== 3. Graphs ==================== */
function genCoordinatesMidpoint(){
  const x1=nonZero(-8,8), y1=nonZero(-8,8), x2=nonZero(-8,8), y2=nonZero(-8,8);
  if(x1===x2&&y1===y2) return genCoordinatesMidpoint();

function genQuadraticGraphRead(){
  /* Roots are integers so they can be read exactly off the drawn axes. */
  const p=nonZero(-4,4), q=nonZero(-4,4);
  if(p===q) return genQuadraticGraphRead();
  const r1=Math.min(-p,-q), r2=Math.max(-p,-q);
  const b=p+q, c=p*q;
  const fx=(x)=>x*x+b*x+c;
  const vx=-b/2, vy=fx(vx);
  /* Window: symmetric about the vertex so the parabola is centered and both roots show. */
  const halfWidth=Math.max(r2-vx, vx-r1)+2;
  const xMin=Math.floor(vx-halfWidth), xMax=Math.ceil(vx+halfWidth);
  const yMin=Math.floor(Math.min(vy,0))-1;
  const yMax=Math.ceil(Math.max(fx(xMin),fx(xMax),1));
  const f=chartFrame(xMin,xMax,yMin,yMax,1,null,320,250,false);
  const d=plotCurve(f,fx,xMin,xMax,yMin,yMax);
  const svg=svgWrap(f.width,f.height,f.svgBase+'<path d="'+d+'" fill="none" stroke="'+SVG_ACCENT+'" stroke-width="2.2" stroke-linecap="round"/>');
  const eq=poly(1,b,c,'x');
  const ask=choice(['roots','turning']);
  if(ask==='roots'){
    const correct='x = '+r1+' or x = '+r2;
    return finalize('Graphs','quadraticGraph','The graph of <span class="num">y = '+eq+'</span> is shown. Use it to write down the solutions of <span class="num">'+eq+' = 0</span>.'+svg,correct,
      ['x = '+(-r1)+' or x = '+(-r2),'x = '+r1+' or x = '+(r2+1),'x = '+round(vx,1)+' or x = '+round(vy,1)],
      'The solutions of '+eq+' = 0 are where the curve crosses the x-axis: <b>'+correct+'</b>.');
  }
  const correct='('+round(vx,2)+', '+round(vy,2)+')';
  return finalize('Graphs','quadraticGraph','The graph of <span class="num">y = '+eq+'</span> is shown. Write down the coordinates of its turning point.'+svg,correct,
    ['('+r1+', 0)','('+round(-vx,2)+', '+round(vy,2)+')','(0, '+c+')'],
    'The turning point lies halfway between the roots '+r1+' and '+r2+', so x = '+round(vx,2)+'. Substituting back gives y = '+round(vy,2)+', so the minimum is <b>'+correct+'</b>. Completing the square gives the same answer.');
}
function genDistanceTime(){

  const tRest=randInt(1,2);
  const t3=randInt(1,3), d3=randInt(20,80);
  const times=[0,t1,t1+tRest,t1+tRest+t3];
  const dists=[0,d1,d1,d1+d3];
  const f=chartFrame(0,times[3],0,dists[3],null,null,320,220,false);
  let path='';
  times.forEach((t,i)=>{ const p=f.toPx(t,dists[i]); path+=(i===0?'M ':'L ')+p.x.toFixed(1)+' '+p.y.toFixed(1)+' '; });
  const svg=svgWrap(f.width,f.height,f.svgBase+'<path d="'+path+'" fill="none" stroke="'+SVG_ACCENT+'" stroke-width="2.4" stroke-linejoin="round"/>'+
    txt(f.margin.left+f.plotW/2, f.height-4,'time (hours)',{size:9})+txt(f.margin.left,10,'distance (km)',{size:9,anchor:'start'}));
  const ask=choice(['speed1','speed3','rest']);
  if(ask==='rest'){
    return finalize('Graphs','distanceTime','The distance–time graph shows a journey. For how many hours was the traveler stationary?'+svg,tRest,
      [t1,t3,times[3]],'A horizontal section means the distance is not changing, so the traveler is at rest. That lasts <b>'+tRest+' hours</b>.');
  }
  const seg= ask==='speed1'? {t:t1,d:d1,label:'first'} : {t:t3,d:d3,label:'final'};

    [round(seg.t/seg.d,3), seg.d, round(dists[3]/times[3],2)],
    'Speed is the gradient of a distance–time graph: '+seg.d+' km ÷ '+seg.t+' h = <b>'+correct+' km/h</b>.');
}

function genSimplifyRatio(){

    [(k*a)+' : '+(k*b), b+' : '+a, (a*2)+' : '+(b*2)],

function genShareRatio(){
  const a=randInt(2,7), b=randInt(2,7), c=choice([0,0,randInt(2,5)]);
  if(gcd(a,b)!==1 && !c) return genShareRatio();   /* a ratio is quoted in its simplest form */
  const parts=a+b+c;
  const unit=randInt(3,25);
  const total=parts*unit;
  const ratio= c? a+' : '+b+' : '+c : a+' : '+b;
  const which= c? choice([a,b,c]) : choice([a,b]);
  const correct=which*unit;
  return finalize('Ratio','shareRatio','AED <span class="num">'+total+'</span> is shared in the ratio <span class="num">'+ratio+'</span>. How much does the person with <span class="num">'+which+'</span> part'+(which>1?'s':'')+' receive?',
    'AED '+correct,
    ['AED '+round(total/which,2),'AED '+(total-correct),'AED '+(which*total/(parts+1)).toFixed(2)],
    'There are '+parts+' parts altogether, so one part is '+total+' ÷ '+parts+' = AED '+unit+'. Then '+which+' × '+unit+' = <b>AED '+correct+'</b>.');

  const which=choice(['opp','adj','hyp']);
  let correct, ratio, svg, working;
  const rad=ang*Math.PI/180;
  if(which==='opp'){
    correct=round(known*Math.tan(rad),2);
    ratio='tan'; working='tan '+ang+'° = opposite / '+known+', so opposite = '+known+' × tan '+ang+'° = '+correct;
    svg=rightTriangleSVG({base:known+' cm',height:'x',angle:ang+'°'});
  }else if(which==='adj'){
    correct=round(known*Math.cos(rad),2);
    ratio='cos'; working='cos '+ang+'° = adjacent / '+known+', so adjacent = '+known+' × cos '+ang+'° = '+correct;
    svg=rightTriangleSVG({base:'x',hyp:known+' cm',angle:ang+'°'});
  }else{
    correct=round(known/Math.cos(rad),2);
    ratio='cos'; working='cos '+ang+'° = '+known+' / x, so x = '+known+' ÷ cos '+ang+'° = '+correct;
    svg=rightTriangleSVG({base:known+' cm',hyp:'x',angle:ang+'°'});
  }
  return finalize('Geometry','trigonometry','Find the length <span class="num">x</span>, to 2 decimal places.'+svg+NOT_TO_SCALE,correct+' cm',
    [round(known*Math.sin(rad),2)+' cm',round(known/Math.tan(rad),2)+' cm',round(known*Math.tan(rad)*2,2)+' cm'],
    'Label the sides relative to the '+ang+'° angle, then use <b>'+ratio.toUpperCase()+'</b>: '+working+'.');
}
function genTrigAngle(){
  const triples=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25]];
  const t=choice(triples);
  const which=choice(['sin','cos','tan']);
  let correct, pair;
  if(which==='sin'){ correct=round(Math.asin(t[1]/t[2])*180/Math.PI,1); pair='the side opposite θ is '+t[1]+' cm and the hypotenuse is '+t[2]+' cm'; }
  else if(which==='cos'){ correct=round(Math.acos(t[0]/t[2])*180/Math.PI,1); pair='the side adjacent to θ is '+t[0]+' cm and the hypotenuse is '+t[2]+' cm'; }
  else { correct=round(Math.atan(t[1]/t[0])*180/Math.PI,1); pair='the side opposite θ is '+t[1]+' cm and the side adjacent to θ is '+t[0]+' cm'; }
  return finalize('Geometry','trigFindAngle','In a right-angled triangle, '+pair+'. Find the angle θ, to 1 decimal place.',correct+'°',
    [round(90-correct,1)+'°',round(correct*2,1)+'°',round(180-correct,1)+'°'],
    'Use the inverse function: θ = '+which+'<sup>−1</sup>('+(which==='sin'?t[1]+'/'+t[2]:which==='cos'?t[0]+'/'+t[2]:t[1]+'/'+t[0])+') = <b>'+correct+'°</b>.');
}
function genExactTrig(){
  const table=[
    {a:0,sin:'0',cos:'1',tan:'0'},
    {a:30,sin:'1/2',cos:'√3/2',tan:'1/√3'},
    {a:45,sin:'1/√2',cos:'1/√2',tan:'1'},
    {a:60,sin:'√3/2',cos:'1/2',tan:'√3'},
    {a:90,sin:'1',cos:'0',tan:'undefined'}
  ];
  const row=choice(table.filter(r=>r.a!==90||true));
  const fn=choice(['sin','cos','tan']);
  const correct=row[fn];
  if(correct==='undefined') return genExactTrig();
  const others=[...new Set(table.flatMap(r=>[r.sin,r.cos,r.tan]).filter(v=>v!==correct&&v!=='undefined'))];
  return finalize('Geometry','exactTrig','Write down the exact value of <span class="num">'+fn+' '+row.a+'°</span>.',correct,
    shuffle(others).slice(0,3),
    'These come from the 30–60–90 and 45–45–90 triangles and must be learned. '+fn+' '+row.a+'° = <b>'+correct+'</b>.');
}
function genSimilarLengths(){

function genSimilarAreaVolume(){

function genTransformations(){
  const kind=choice(['translate','reflect','rotate','enlarge']);
  const x=nonZero(-6,6), y=nonZero(-6,6);
  if(kind==='translate'){
    const a=nonZero(-6,6), b=nonZero(-6,6);
    const correct='('+(x+a)+', '+(y+b)+')';
    return finalize('Geometry','transformations','The point <span class="num">('+x+', '+y+')</span> is translated by the vector <span class="num">('+a+', '+b+')</span>. Write down its image.',correct,
      ['('+(x-a)+', '+(y-b)+')','('+(y+b)+', '+(x+a)+')','('+(x*a)+', '+(y*b)+')'],
      'Add the vector to the coordinates: ('+x+' + '+a+', '+y+' + '+b+') = <b>'+correct+'</b>.');
  }
  if(kind==='reflect'){
    const line=choice(['x-axis','y-axis','y = x']);
    const correct= line==='x-axis'? '('+x+', '+(-y)+')' : line==='y-axis'? '('+(-x)+', '+y+')' : '('+y+', '+x+')';
    return finalize('Geometry','transformations','The point <span class="num">('+x+', '+y+')</span> is reflected in the line <span class="num">'+line+'</span>. Write down its image.',correct,
      ['('+(-x)+', '+(-y)+')','('+y+', '+x+')','('+x+', '+y+')'],
      'Reflecting in the '+line+' '+(line==='x-axis'?'changes the sign of the y-coordinate':line==='y-axis'?'changes the sign of the x-coordinate':'swaps the coordinates')+': <b>'+correct+'</b>.');
  }
  if(kind==='rotate'){
    const deg=choice([90,180,270]);
    const dir=choice(['clockwise','anticlockwise']);
    let cx=x, cy=y;
    let steps= dir==='clockwise'? deg/90 : (360-deg)/90;
    for(let i=0;i<steps%4;i++){ const t=cx; cx=cy; cy=-t; }   /* one 90° clockwise turn about the origin */
    const correct='('+cx+', '+cy+')';
    return finalize('Geometry','transformations','The point <span class="num">('+x+', '+y+')</span> is rotated <span class="num">'+deg+'° '+dir+'</span> about the origin. Write down its image.',correct,
      ['('+(-cx)+', '+(-cy)+')','('+cy+', '+cx+')','('+x+', '+y+')'],
      'A 90° clockwise turn about the origin sends (a, b) to (b, −a). Applying that '+(steps%4)+' time(s) gives <b>'+correct+'</b>.');
  }
  const k=choice([2,3,-2,0.5]);
  const correct='('+round(x*k,2)+', '+round(y*k,2)+')';
  return finalize('Geometry','transformations','The point <span class="num">('+x+', '+y+')</span> is enlarged by scale factor <span class="num">'+k+'</span> about the origin. Write down its image.',correct,
    ['('+round(x/k,2)+', '+round(y/k,2)+')','('+round(x+k,2)+', '+round(y+k,2)+')','('+round(y*k,2)+', '+round(x*k,2)+')'],
    'Multiply both coordinates by the scale factor '+k+': <b>'+correct+'</b>.'+(k<0?' A negative scale factor also sends the image to the opposite side of the center.':''));
}

function genCircleTheorem(){

      [round(a/2,1)+'°',(180-a)+'°',(90-a)+'°'],

/* ==================== 6. Probability and statistics ==================== */
function tableHTML(headers,rows){
  let h='<div class="scroll-x"><table class="qtable"><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ h+='<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>'; });
  return h+'</table></div>';
}
function genAveragesList(){
  const n=choice([5,7,9]);
  const data=Array.from({length:n},()=>randInt(1,20));
  const sorted=[...data].sort((a,b)=>a-b);
  const mean=round(data.reduce((s,x)=>s+x,0)/n,2);
  const median=sorted[(n-1)/2];
  const range=sorted[n-1]-sorted[0];
  const ask=choice(['mean','median','range']);
  const correct= ask==='mean'? mean : ask==='median'? median : range;
  return finalize('Statistics','averages','Find the '+ask+' of this data set:<br><span class="num">'+data.join(', ')+'</span>',correct,
    [mean===correct?median:mean, median===correct?range:median, range===correct?mean:range],
    ask==='mean'? 'Add them up ('+data.reduce((s,x)=>s+x,0)+') and divide by '+n+': <b>'+mean+'</b>.'
    : ask==='median'? 'Put them in order: '+sorted.join(', ')+'. The middle value is <b>'+median+'</b>.'
    : 'Range = largest − smallest = '+sorted[n-1]+' − '+sorted[0]+' = <b>'+range+'</b>.');
}
function genAveragesFreqTable(){
  const vals=[0,1,2,3,4];
  const freqs=vals.map(()=>randInt(1,9));
  const N=freqs.reduce((s,x)=>s+x,0);
  const sumFX=vals.reduce((s,v,i)=>s+v*freqs[i],0);
  const mean=round(sumFX/N,2);
  const mode=vals[freqs.indexOf(Math.max(...freqs))];
  let cum=0, median=null;
  const pos=(N+1)/2;
  for(let i=0;i<vals.length;i++){ cum+=freqs[i]; if(median===null&&cum>=pos) median=vals[i]; }
  const table=tableHTML(['Goals','Frequency'],vals.map((v,i)=>[v,freqs[i]]));
  const ask=choice(['mean','median','mode']);
  const correct= ask==='mean'? mean : ask==='median'? median : mode;
  return finalize('Statistics','frequencyTable','The table shows the number of goals scored in '+N+' matches. Find the '+ask+'.'+table,correct,
    [mean===correct?mode:mean, median===correct?mode:median, mode===correct?mean:mode],
    ask==='mean'? 'Add an fx column: Σfx = '+sumFX+' and Σf = '+N+', so the mean is '+sumFX+' ÷ '+N+' = <b>'+mean+'</b>.'
    : ask==='median'? 'There are '+N+' values, so the median is value number '+pos+'. Counting through the frequencies gives <b>'+median+'</b>.'
    : 'The mode is the value with the highest frequency ('+Math.max(...freqs)+'), which is <b>'+mode+'</b>.');
}
function genEstimatedMean(){
  const width=choice([10,20,5]);
  const starts=[0,width,2*width,3*width];
  const freqs=starts.map(()=>randInt(2,12));
  const mids=starts.map(s=>s+width/2);
  const N=freqs.reduce((s,x)=>s+x,0);
  const sumFX=mids.reduce((s,m,i)=>s+m*freqs[i],0);
  const mean=round(sumFX/N,2);
  const rows=starts.map((s,i)=>[s+' &lt; x ≤ '+(s+width), freqs[i]]);
  const table=tableHTML(['Class','Frequency'],rows);
  return finalize('Statistics','estimatedMean','The grouped table shows the times taken by '+N+' students. Calculate an estimate of the mean, to 2 decimal places.'+table,mean,
    [round(mids.reduce((s,m)=>s+m,0)/4,2), round(sumFX,2), round(N/4,2)],
    'Use the midpoint of each class ('+mids.join(', ')+'). Σfx = '+sumFX+' and Σf = '+N+', so the estimated mean is '+sumFX+' ÷ '+N+' = <b>'+mean+'</b>. It is only an estimate because the exact values inside each class are unknown.');
}
function genCumulativeFrequency(){
  const width=10;
  const starts=[0,10,20,30,40];
  const freqs=starts.map(()=>randInt(3,15));
  const cum=[]; let running=0;
  freqs.forEach(f=>{ running+=f; cum.push(running); });
  const N=running;
  const table=tableHTML(['Class','Frequency','Cumulative frequency'],starts.map((s,i)=>[s+' &lt; x ≤ '+(s+width),freqs[i],cum[i]]));
  const half=N/2;
  let medClass=0;
  for(let i=0;i<cum.length;i++){ if(cum[i]>=half){ medClass=i; break; } }
  const correct=starts[medClass]+' &lt; x ≤ '+(starts[medClass]+width);
  return finalize('Statistics','cumulativeFrequency','The table shows the cumulative frequency for '+N+' values. Which class interval contains the median?'+table,correct,
    starts.filter((s,i)=>i!==medClass).slice(0,3).map(s=>s+' &lt; x ≤ '+(s+width)),
    'The median is the '+half+'th value. The cumulative frequency first reaches '+half+' in the class <b>'+correct+'</b>.');
}
function genBoxPlot(){

  const ask=choice(['iqr','range']);
  const correct= ask==='iqr'? q3-q1 : max-min;
  return finalize('Statistics','boxPlot',
    'A box plot has minimum <span class="num">'+min+'</span>, lower quartile <span class="num">'+q1+'</span>, median <span class="num">'+med+'</span>, upper quartile <span class="num">'+q3+'</span> and maximum <span class="num">'+max+'</span>. Find the '+(ask==='iqr'?'interquartile range':'range')+'.',correct,
    [ask==='iqr'? max-min : q3-q1, med, q3+q1],
    ask==='iqr'? 'IQR = upper quartile − lower quartile = '+q3+' − '+q1+' = <b>'+correct+'</b>.' : 'Range = maximum − minimum = '+max+' − '+min+' = <b>'+correct+'</b>.');
}
function genHistogram(){
  const classes=[[0,10],[10,20],[20,50],[50,60]];
  const freqs=classes.map(()=>randInt(5,60));
  const i=randInt(0,3);
  const w=classes[i][1]-classes[i][0];
  const fd=round(freqs[i]/w,2);
  const ask=choice(['fd','freq']);
  if(ask==='fd'){
    const rows=classes.map((c,j)=>[c[0]+' &lt; x ≤ '+c[1],freqs[j]]);
    return finalize('Statistics','histogram','The table shows grouped data with unequal class widths. Find the frequency density of the class <span class="num">'+classes[i][0]+' &lt; x ≤ '+classes[i][1]+'</span>.'+tableHTML(['Class','Frequency'],rows),fd,
      [freqs[i], round(w/freqs[i],3), freqs[i]*w],
      'Frequency density = frequency ÷ class width = '+freqs[i]+' ÷ '+w+' = <b>'+fd+'</b>. On a histogram it is the frequency density, not the frequency, that goes on the vertical axis.');
  }
  const fdGiven=round(freqs[i]/w,2);
  const correct=round(fdGiven*w,0);
  return finalize('Statistics','histogram','On a histogram, the bar for <span class="num">'+classes[i][0]+' &lt; x ≤ '+classes[i][1]+'</span> has frequency density <span class="num">'+fdGiven+'</span>. Find the frequency for this class.',correct,
    [fdGiven, round(fdGiven/w,3), w],
    'Frequency = frequency density × class width = '+fdGiven+' × '+w+' = <b>'+correct+'</b> (the area of the bar).');
}
function genScatter(){

    let y;
    if(type==='positive') y=Math.max(1,Math.min(19,Math.round(x*0.8+randInt(-2,2)+2)));
    else if(type==='negative') y=Math.max(1,Math.min(19,Math.round(20-x*0.8+randInt(-2,2))));
    else y=randInt(1,19);
    pts.push([x,y]);
  }
  const f=chartFrame(0,20,0,20,5,5,300,240,true);
  let dots='';
  pts.forEach(p=>{ const q=f.toPx(p[0],p[1]); dots+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="3.4" fill="'+SVG_ACCENT+'" opacity="0.85"/>'; });
  const svg=svgWrap(f.width,f.height,f.svgBase+dots);
  const label= type==='positive'?'Positive correlation': type==='negative'?'Negative correlation':'No correlation';
  return finalize('Statistics','scatter','Describe the correlation shown by this scatter graph.'+svg,label,
    ['Positive correlation','Negative correlation','No correlation','Perfect correlation'].filter(l=>l!==label).slice(0,3),
    type==='none'? 'The points are scattered with no clear trend, so there is <b>no correlation</b>. Remember that correlation never proves cause.'
      : 'As one variable increases the other '+(type==='positive'?'increases':'decreases')+', so this is <b>'+label.toLowerCase()+'</b>.');
}

function genProbabilityBasic(){
  const r=randInt(2,9), b=randInt(2,9), g=randInt(2,9);
  const total=r+b+g;
  const which=choice([['red',r],['blue',b],['green',g]]);
  const kind=choice(['single','not']);
  if(kind==='single'){
    const correct=frac(which[1],total);
    return finalize('Statistics','probability','A bag contains <span class="num">'+r+'</span> red, <span class="num">'+b+'</span> blue and <span class="num">'+g+'</span> green counters. One is taken at random. Find the probability that it is '+which[0]+'.',correct,
      [frac(total,which[1]), frac(which[1],total-which[1]), frac(which[1]+1,total)],

  }
  const correct=frac(total-which[1],total);
  return finalize('Statistics','probability','A bag contains <span class="num">'+r+'</span> red, <span class="num">'+b+'</span> blue and <span class="num">'+g+'</span> green counters. One is taken at random. Find the probability that it is <b>not</b> '+which[0]+'.',correct,
    [frac(which[1],total), frac(total,total-which[1]), frac(total-which[1],which[1])],

function genRelativeFrequency(){

  const bigger=choice([200,400,1000]);

    'A biased dice is rolled <span class="num">'+trials+'</span> times and lands on six <span class="num">'+hits+'</span> times. Estimate how many sixes there would be in <span class="num">'+bigger+'</span> rolls.',correct,
    [hits, Math.round(bigger/6), Math.round(bigger-correct)],

function genTreeDiagram(){
  const d1=choice([4,5,8,10]), n1=randInt(1,d1-1);
  const d2=choice([4,5,8,10]), n2=randInt(1,d2-1);
  const kind=choice(['both','neither','exactlyOne']);
  let num,den,label,working;
  if(kind==='both'){ num=n1*n2; den=d1*d2; label='both events happen'; working='P(A and B) = '+n1+'/'+d1+' × '+n2+'/'+d2; }
  else if(kind==='neither'){ num=(d1-n1)*(d2-n2); den=d1*d2; label='neither event happens'; working='P(not A and not B) = '+(d1-n1)+'/'+d1+' × '+(d2-n2)+'/'+d2; }
  else { num=n1*(d2-n2)+(d1-n1)*n2; den=d1*d2; label='exactly one of them happens'; working='Add the two branches: '+n1+'/'+d1+' × '+(d2-n2)+'/'+d2+' + '+(d1-n1)+'/'+d1+' × '+n2+'/'+d2; }
  const correct=frac(num,den);
  return finalize('Statistics','treeDiagram',
    'Two independent events A and B have <span class="num">P(A) = '+frac(n1,d1)+'</span> and <span class="num">P(B) = '+frac(n2,d2)+'</span>. Find the probability that '+label+'.',correct,
    [frac(n1*d2+n2*d1,d1*d2), frac(n1+n2,d1+d2), frac(den-num,den)],
    'Draw a tree diagram: multiply <i>along</i> branches and add <i>between</i> them. '+working+' = <b>'+correct+'</b>.');
}
function genProbWithoutReplacement(){
  const r=randInt(3,8), b=randInt(3,8);
  const total=r+b;
  const kind=choice(['bothRed','oneEach']);
  let num,den,working;
  if(kind==='bothRed'){
    num=r*(r-1); den=total*(total-1);
    working='P(red then red) = '+r+'/'+total+' × '+(r-1)+'/'+(total-1);
  }else{
    num=2*r*b; den=total*(total-1);
    working='P(one of each) = '+r+'/'+total+' × '+b+'/'+(total-1)+' + '+b+'/'+total+' × '+r+'/'+(total-1);
  }
  const correct=frac(num,den);
  return finalize('Statistics','withoutReplacement',
    'A bag holds <span class="num">'+r+'</span> red and <span class="num">'+b+'</span> blue counters. Two are taken <b>without replacement</b>. Find the probability that '+(kind==='bothRed'?'both are red':'one of each color is taken')+'.',correct,
    [kind==='bothRed'? frac(r*r,total*total) : frac(2*r*b,total*total), frac(num,total*total), frac(r,total)],
    'After the first counter there are only '+(total-1)+' left, so the second fraction changes. '+working+' = <b>'+correct+'</b>.');
}
function genVennSets(){
  const both=randInt(2,6), onlyA=randInt(3,9), onlyB=randInt(3,9), neither=randInt(1,6);
  const total=both+onlyA+onlyB+neither;
  const ask=choice(['union','intersectionProb','complement','conditional']);
  if(ask==='union'){
    const correct=onlyA+onlyB+both;
    return finalize('Statistics','venn',
      'In a group of '+total+' students, '+(onlyA+both)+' study French, '+(onlyB+both)+' study Spanish and '+both+' study both. How many study French <b>or</b> Spanish (or both)?',correct,
      [onlyA+onlyB, onlyA+onlyB+both+neither, both],
      'n(F ∪ S) = n(F) + n(S) − n(F ∩ S) = '+(onlyA+both)+' + '+(onlyB+both)+' − '+both+' = <b>'+correct+'</b>. Subtracting the overlap stops it being counted twice.');
  }
  if(ask==='intersectionProb'){
    const correct=frac(both,total);
    return finalize('Statistics','venn',
      'In a group of '+total+' students, '+(onlyA+both)+' study French, '+(onlyB+both)+' study Spanish and '+both+' study both. One student is chosen at random. Find P(French and Spanish).',correct,
      [frac(onlyA+both,total), frac(both,onlyA+onlyB), frac(onlyA+onlyB+both,total)],
      both+' of the '+total+' students are in the overlap, so the probability is '+both+'/'+total+' = <b>'+correct+'</b>.');
  }
  if(ask==='complement'){
    const correct=neither;
    return finalize('Statistics','venn',
      'In a group of '+total+' students, '+(onlyA+both)+' study French, '+(onlyB+both)+' study Spanish and '+both+' study both. How many study neither subject?',correct,
      [total-both, onlyA+onlyB, total-onlyA-onlyB],
      'Inside the two circles there are '+(onlyA+onlyB+both)+' students, so outside them there are '+total+' − '+(onlyA+onlyB+both)+' = <b>'+neither+'</b>.');
  }
  const correct=frac(both,onlyB+both);
  return finalize('Statistics','venn',
    'In a group of '+total+' students, '+(onlyA+both)+' study French, '+(onlyB+both)+' study Spanish and '+both+' study both. A student who studies Spanish is chosen at random. Find the probability that they also study French.',correct,
    [frac(both,total), frac(both,onlyA+both), frac(onlyB,onlyB+both)],
    'This is conditional: the sample is now only the '+(onlyB+both)+' Spanish students, and '+both+' of them also study French, giving '+both+'/'+(onlyB+both)+' = <b>'+correct+'</b>.');

function genSampling(){

}

function dTerm(c,n){
  if(n===0) return null;
  const nc=c*n, np=n-1;
  return {c:nc, p:np};
}
function polyStr(terms){
  let s='';
  terms.forEach((t,i)=>{
    if(t.c===0) return;
    const abs=Math.abs(t.c);
    let piece= t.p===0? String(abs) : (abs===1?'':abs)+'x'+(t.p===1?'':'<sup>'+t.p+'</sup>');
    if(s===''){ s=(t.c<0?'−':'')+piece; }
    else{ s+=(t.c<0?' − ':' + ')+piece; }
  });
  return s===''?'0':s;
}
function genDifferentiate(){
  const a=randInt(2,6), b=nonZero(-8,8), c=nonZero(-9,9);
  const n=choice([2,3]);
  const terms=[{c:a,p:n},{c:b,p:1},{c:c,p:0}];
  const der=terms.map(t=>dTerm(t.c,t.p)).filter(Boolean);
  const correct=polyStr(der);
  return finalize('Calculus','differentiate','Differentiate <span class="num">y = '+polyStr(terms)+'</span>.',correct,
    [polyStr([{c:a*n,p:n},{c:b,p:1}]), polyStr(terms), polyStr(der.concat([{c:c,p:0}]))],
    'Multiply by the power and reduce the power by one. '+a+'x<sup>'+n+'</sup> → '+(a*n)+'x<sup>'+(n-1)+'</sup>, '+b+'x → '+b+', and the constant '+c+' differentiates to 0. So dy/dx = <b>'+correct+'</b>.');
}
function genGradientAtPoint(){
  const a=randInt(1,5), b=nonZero(-8,8), x=nonZero(-4,5);
  const grad=2*a*x+b;
  return finalize('Calculus','gradientAtPoint','Find the gradient of the curve <span class="num">y = '+a+'x<sup>2</sup> '+sgn(b)+'x</span> at the point where <span class="num">x = '+x+'</span>.',grad,
    [a*x*x+b*x, 2*a*x, a*2+b],
    'Differentiate: dy/dx = '+(2*a)+'x '+sgn(b)+'. Then substitute x = '+x+': '+(2*a)+'×('+x+') '+sgn(b)+' = <b>'+grad+'</b>.');
}
function genStationaryPoint(){
  const a=randInt(1,3);
  const h=nonZero(-5,5);
  const b=-2*a*h;               /* so dy/dx = 2ax + b = 0 at x = h */
  const c=nonZero(-9,9);
  const y=a*h*h+b*h+c;
  const ask=choice(['x','nature']);
  if(ask==='x'){
    const correct='('+h+', '+y+')';
    return finalize('Calculus','stationaryPoints','Find the coordinates of the stationary point on the curve <span class="num">y = '+poly(a,b,c,'x')+'</span>.',correct,
      ['('+(-h)+', '+y+')','('+h+', '+c+')','('+y+', '+h+')'],
      'Set dy/dx = '+(2*a)+'x '+sgn(b)+' = 0, giving x = '+h+'. Substituting back gives y = '+y+', so the stationary point is <b>'+correct+'</b>.');
  }
  return finalize('Calculus','stationaryPoints','The curve <span class="num">y = '+poly(a,b,c,'x')+'</span> has one stationary point. Is it a maximum or a minimum?','Minimum',
    ['Maximum','A point of inflection','It cannot be determined'],
    'The second derivative is d<sup>2</sup>y/dx<sup>2</sup> = '+(2*a)+', which is positive, so the curve is a <b>minimum</b>. (Any positive x<sup>2</sup> coefficient gives a U-shape.)');
}
function genKinematics(){
  const a=randInt(1,4), b=nonZero(-9,9), t=randInt(1,5);
  const ask=choice(['velocity','acceleration']);
  if(ask==='velocity'){
    const v=3*a*t*t+b;
    return finalize('Calculus','kinematics','A particle has displacement <span class="num">s = '+a+'t<sup>3</sup> '+sgn(b)+'t</span> meters after t seconds. Find its velocity when <span class="num">t = '+t+'</span>, in m/s.',v,
      [a*t*t*t+b*t, 6*a*t, 3*a*t+b],
      'Velocity is the derivative of displacement: v = '+(3*a)+'t<sup>2</sup> '+sgn(b)+'. At t = '+t+': '+(3*a)+'×'+(t*t)+' '+sgn(b)+' = <b>'+v+' m/s</b>.');
  }
  const acc=6*a*t;
  return finalize('Calculus','kinematics','A particle has displacement <span class="num">s = '+a+'t<sup>3</sup> '+sgn(b)+'t</span> meters after t seconds. Find its acceleration when <span class="num">t = '+t+'</span>, in m/s<sup>2</sup>.',acc,
    [3*a*t*t+b, a*t*t*t+b*t, 6*a],
    'Differentiate twice: v = '+(3*a)+'t<sup>2</sup> '+sgn(b)+', then a = '+(6*a)+'t. At t = '+t+': '+(6*a)+' × '+t+' = <b>'+acc+' m/s<sup>2</sup></b>.');
}
