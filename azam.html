<body>
<div class="wrap" id="app"></div>

<script>
/* ==================== Utilities ==================== */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b];}return a||1;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function extractNumberParts(str){
  const m=str.match(/-?\d+(\.\d+)?/);
  if(!m) return null;
  return {before:str.slice(0,m.index), numStr:m[0], after:str.slice(m.index+m[0].length)};
}
function numericVariant(str, offset){
  const parts=extractNumberParts(str);
  if(!parts) return null;
  const isDecimal=parts.numStr.includes('.');
  const decimals=isDecimal? parts.numStr.split('.')[1].length : 0;
  const newNum=parseFloat(parts.numStr)+offset;
  const newNumStr= decimals>0? newNum.toFixed(decimals) : String(Math.round(newNum));
  return parts.before+newNumStr+parts.after;
}
function finalize(topicLabel,subtopic,text,correctVal,distractorVals,explanation){
  const correctStr=String(correctVal);
  let uniq=[...new Set(distractorVals.map(String))].filter(d=>d!==correctStr);
  let offsetTry=1, guard=0;
  while(uniq.length<3 && guard<40){
    guard++;
    const sign=offsetTry%2===0?-1:1;
    const magnitude=Math.ceil(offsetTry/2);
    const candidate=numericVariant(correctStr, sign*magnitude);
    offsetTry++;
    if(candidate===null){
      const fallback=`${correctStr} (other)`;
      if(!uniq.includes(fallback)) uniq.push(fallback);
      continue;
    }
    if(candidate!==correctStr && !uniq.includes(candidate)) uniq.push(candidate);
  }
  uniq=uniq.slice(0,3);
  while(uniq.length<3) uniq.push(`${correctStr} (other)`);
  const all=shuffle([correctStr,...uniq]);
  const correctIndex=all.indexOf(correctStr);
  return {topic:topicLabel,subtopic,text,choices:all,correctIndex,explanation:explanation||''};
}

/* ==================== Chart helpers (SVG) ==================== */
function svgWrap(width,height,inner){
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:320px;height:auto;display:block;margin:14px auto;background:#fff;border-radius:10px;">${inner}</svg>`;
}
function pickNiceStep(range, targetLines){
  // Rounds a raw "step size" up to a friendly grid interval (1, 2, 5, 10, 20, 50 ...).
  const raw = range / Math.max(1, targetLines);
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const norm = raw / mag;
  const niceNorm = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return niceNorm * mag;
}
function chartFrame(xMin,xMax,yMin,yMax,xStep,yStep,width,height,equalScale){
  width=width||300; height=height||240;
  // Bounds so a chart never gets absurdly tall/narrow when a data range is extreme.
  const MAX_HEIGHT=360, MIN_PLOT_W=140;
  const m={left:34,right:14,top:14,bottom:28};
  const availW=width-m.left-m.right, availH0=height-m.top-m.bottom;
  const xRange=xMax-xMin, yRange=yMax-yMin;
  equalScale = equalScale!==false;

  let scale, scaleX, scaleY, pw, ph, finalWidth, finalHeight;
  if(equalScale){
    // Use the SAME pixel-per-unit scale on both axes. If the x and y axes were
    // scaled differently (as before), a line's on-screen angle no longer matches
    // its true gradient — e.g. a slope of 2 could be drawn looking flatter than a
    // slope of 1. Solving for one shared scale keeps every grid square a true
    // square, so gradients and shapes are always drawn to true scale.
    scale=availW/xRange;
    finalHeight=Math.round(yRange*scale+m.top+m.bottom);
    if(finalHeight>MAX_HEIGHT){
      scale=(MAX_HEIGHT-m.top-m.bottom)/yRange;
      finalHeight=MAX_HEIGHT;
    }
    pw=xRange*scale;
    if(pw<MIN_PLOT_W){
      scale=MIN_PLOT_W/xRange;
      pw=MIN_PLOT_W;
      finalHeight=Math.round(yRange*scale+m.top+m.bottom);
    }
    ph=yRange*scale;
    finalWidth=Math.round(pw+m.left+m.right);
    scaleX=scale; scaleY=scale;
  }else{
    // Axes represent different kinds of quantity (e.g. time vs. distance), so
    // there's no "true" shared scale to preserve — size each axis to fill the
    // box independently, same as a normal chart.
    pw=availW; ph=availH0;
    scaleX=pw/xRange; scaleY=ph/yRange;
    finalWidth=width; finalHeight=height;
  }

  function toPx(x,y){
    return {
      x: m.left + (x-xMin)*scaleX,
      y: m.top + ph - (y-yMin)*scaleY
    };
  }
  // Grid-line spacing still adapts per axis (so labels never overlap), but
  // when equalScale is on, the underlying scale above is shared, so every
  // 1x1 unit cell is a true square regardless of how many lines get drawn.
  const autoXStep = xStep || pickNiceStep(xRange, Math.max(2, pw/48));
  const autoYStep = yStep || pickNiceStep(yRange, Math.max(2, ph/34));

  let grid='';
  const startX = Math.ceil(xMin / autoXStep) * autoXStep;
  for(let gx=startX; gx<=xMax+1e-6; gx+=autoXStep){
    const p=toPx(gx,yMin);
    grid+=`<line x1="${p.x}" y1="${m.top}" x2="${p.x}" y2="${m.top+ph}" stroke="#E4ECF8" stroke-width="1"/>`;
    grid+=`<text x="${p.x}" y="${m.top+ph+16}" font-size="9" fill="#5A6B8C" text-anchor="middle" font-family="IBM Plex Mono, monospace">${Math.round(gx*100)/100}</text>`;
  }
  const startY = Math.ceil(yMin / autoYStep) * autoYStep;
  for(let gy=startY; gy<=yMax+1e-6; gy+=autoYStep){
    const p=toPx(xMin,gy);
    grid+=`<line x1="${m.left}" y1="${p.y}" x2="${m.left+pw}" y2="${p.y}" stroke="#E4ECF8" stroke-width="1"/>`;
    grid+=`<text x="${m.left-6}" y="${p.y+3}" font-size="9" fill="#5A6B8C" text-anchor="end" font-family="IBM Plex Mono, monospace">${Math.round(gy*100)/100}</text>`;
  }
  let axes='';
  if(0>=xMin&&0<=xMax){ const px=toPx(0,yMin); axes+=`<line x1="${px.x}" y1="${m.top}" x2="${px.x}" y2="${m.top+ph}" stroke="#1B2A4A" stroke-width="1.5"/>`; }
  if(0>=yMin&&0<=yMax){ const py=toPx(xMin,0); axes+=`<line x1="${m.left}" y1="${py.y}" x2="${m.left+pw}" y2="${py.y}" stroke="#1B2A4A" stroke-width="1.5"/>`; }
  const border=`<rect x="${m.left}" y="${m.top}" width="${pw}" height="${ph}" fill="none" stroke="#CBDBF2" stroke-width="1"/>`;
  return {toPx, width:finalWidth, height:finalHeight, svgBase: border+grid+axes, margin:m, plotW:pw, plotH:ph, scaleX, scaleY};
}
function polarToCartesian(cx,cy,r,angleDeg){
  const rad=(angleDeg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)};
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start=polarToCartesian(cx,cy,r,endAngle);
  const end=polarToCartesian(cx,cy,r,startAngle);
  const largeArcFlag = endAngle-startAngle <= 180 ? "0":"1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}

/* ==================== Curriculum registry ==================== */
const CHAPTERS=[
  {id:'number', chapter:1, label:'Number'},
  {id:'algebra', chapter:2, label:'Algebra'},
  {id:'graphs', chapter:3, label:'Graphs'},
  {id:'ratio', chapter:4, label:'Ratio & Proportion'},
  {id:'geometry', chapter:5, label:'Geometry & Measures'},
  {id:'stats', chapter:6, label:'Probability & Statistics'}
];

/* ---------- Number ---------- */
function genRoundingSF(){
  const mode=choice(['dp','sf']);
  if(mode==='dp'){
    const raw=randInt(1000,999999)/1000;
    const places=choice([1,2]);
    const correct=raw.toFixed(places);
    const distractors=[raw.toFixed(places===1?2:1), (raw+ (places===1?0.1:0.01)).toFixed(places), String(Math.floor(raw))];
    const text=`Round ${raw} to ${places} decimal place${places>1?'s':''}.`;
    const explanation=`Look at the digit after the ${places===1?'1st':'2nd'} decimal place to round: ${correct}.`;
    return finalize('Number','roundingSigFig',text,correct,distractors,explanation);
  }else{
    const raw=randInt(1000,98765);
    const sf=choice([1,2,3]);
    function roundSF(n,sig){
      if(n===0) return 0;
      const d=Math.ceil(Math.log10(Math.abs(n))+1e-9);
      const power=sig-d;
      const magnitude=Math.pow(10,power);
      return Math.round(n*magnitude)/magnitude;
    }
    const correct=roundSF(raw,sf);
    const distractors=[roundSF(raw,sf+1),roundSF(raw,Math.max(1,sf-1)),raw];
    const text=`Round ${raw} to ${sf} significant figure${sf>1?'s':''}.`;
    const explanation=`Keep the first ${sf} significant figure${sf>1?'s':''} and round: ${correct}.`;
    return finalize('Number','roundingSigFig',text,correct,distractors,explanation);
  }
}
function genPercentOf(){
  const base=20*randInt(1,25);
  const p=5*randInt(1,19);
  const amount=base*p/100;
  const text=`What is ${p}% of ${base}?`;
  const distractors=[base*p/10, amount+choice([-10,-5,5,10]), base-amount];
  const explanation=`${p}% of ${base} = ${p}/100 × ${base} = ${amount}.`;
  return finalize('Number','percentagesOf',text,amount,distractors,explanation);
}
function genPercentChange(){
  const mode=choice(['increase','decrease']);
  const base=20*randInt(1,25);
  const p=5*randInt(1,19);
  const amount=base*p/100;
  const correct= mode==='increase'? base+amount : base-amount;
  const text=`${mode==='increase'?'Increase':'Decrease'} ${base} by ${p}%.`;
  const distractors=[amount, mode==='increase'?base-amount:base+amount, correct+choice([-10,10])];
  const explanation=`${p}% of ${base} is ${amount}, so the new amount is ${base} ${mode==='increase'?'+':'−'} ${amount} = ${correct}.`;
  return finalize('Number','percentagesChange',text,correct,distractors,explanation);
}
function genReversePercentage(){
  const p=choice([10,20,25,15,5,40,50]);
  const isIncrease=choice([true,false]);
  const original=20*randInt(1,20);
  const result= isIncrease? original*(100+p)/100 : original*(100-p)/100;
  if(!Number.isInteger(result)) return genReversePercentage();
  const commonMistake=Math.round(result-(result*p/100));
  const text=`After a${isIncrease?'n increase':' decrease'} of ${p}%, a price is now £${result}. What was the original price?`;
  const correct=`£${original}`;
  const distractors=[`£${commonMistake}`,`£${result}`,`£${original+(isIncrease?-10:10)}`];
  const explanation=`${result} represents ${isIncrease?100+p:100-p}% of the original. Original = £${result} ÷ ${((isIncrease?100+p:100-p)/100).toFixed(2)} = £${original}.`;
  return finalize('Number','reversePercentage',text,correct,distractors,explanation);
}
function genFractions(){
  const type=choice(['add','sub']);
  let d1=randInt(2,9),n1=randInt(1,d1-1);
  let d2=randInt(2,9),n2=randInt(1,d2-1);
  const l=lcm(d1,d2);
  let text,num;
  if(type==='add'){
    num=n1*(l/d1)+n2*(l/d2);
    text=`Work out ${n1}/${d1} + ${n2}/${d2}. Give your answer in its simplest form.`;
  }else{
    if(n1/d1<n2/d2){[n1,d1,n2,d2]=[n2,d2,n1,d1];}
    num=n1*(l/d1)-n2*(l/d2);
    text=`Work out ${n1}/${d1} − ${n2}/${d2}. Give your answer in its simplest form.`;
  }
  const g=gcd(num,l)||1;
  const simpN=num/g, simpD=l/g;
  const correct=simpD===1?`${simpN}`:`${simpN}/${simpD}`;
  const distractors=[
    simpD!==l? `${num}/${l}` : `${num+1}/${l}`,
    `${n1+n2}/${d1+d2}`,
    simpD===1?`${simpN+1}`:`${simpN+1}/${simpD}`
  ];
  const explanation=`Common denominator ${l}: ${n1}/${d1} = ${n1*(l/d1)}/${l}, ${n2}/${d2} = ${n2*(l/d2)}/${l}. Result simplifies to ${correct}.`;
  return finalize('Number','fractions',text,correct,distractors,explanation);
}
function genFractionsMultiply(){

function toOrdinary(m,e){
  if(e>=1) return String(m*Math.pow(10,e));
  return '0.'+'0'.repeat(Math.abs(e)-1)+m;
}
function genStandardForm(){

  const sfStr=`${mantissa} × 10^${exp}`;
  let text,correct,distractors;
  if(direction==='toStandard'){
    text=`Write ${ordinary} in standard form.`;
    correct=sfStr;
    distractors=[`${mantissa} × 10^${-exp}`,`${mantissa} × 10^${exp+1}`,`${mantissa*10} × 10^${exp-1}`];
  }else{
    text=`Write ${sfStr} as an ordinary number.`;
    correct=ordinary;
    const altExp1=exp+1===0?exp+2:exp+1, altExp2=exp-1===0?exp-2:exp-1;
    distractors=[toOrdinary(mantissa,-exp),toOrdinary(mantissa,altExp1),toOrdinary(mantissa,altExp2)];
  }
  const explanation=`${mantissa} × 10^${exp} means the digit shifts ${Math.abs(exp)} place${Math.abs(exp)===1?'':'s'} to make a ${exp>0?'larger':'smaller'} number: ${ordinary}.`;
  return finalize('Number','standardForm',text,correct,distractors,explanation);
}

function genIndicesBasic(){

  const correct=correctExp===0?'1':`${base}^${correctExp}`;
  const wrongOps=law==='mult'?[correctExp-1,correctExp+1,correctExp+2]:
    law==='div'?[correctExp+1,correctExp+2,-correctExp]:

  const distractors=[fmt(-m,c),fmt(m,-c),fmt(m+1,c)];

}
function genBarChart(){
  const cats=shuffle(['Football','Tennis','Swimming','Cricket','Rugby','Netball']).slice(0,4);
  const values=cats.map(()=>randInt(3,20));
  const width=300,height=220;
  const m={left:34,right:14,top:14,bottom:40};
  const pw=width-m.left-m.right, ph=height-m.top-m.bottom;
  const maxV=Math.max(...values);
  const barW=pw/values.length*0.6;
  const gap=pw/values.length;
  let bars='';
  values.forEach((v,i)=>{
    const bh=(v/maxV)*ph;
    const x=m.left+gap*i+(gap-barW)/2;
    const y=m.top+ph-bh;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="#F2B705" rx="3"/>`;
    bars+=`<text x="${x+barW/2}" y="${m.top+ph+14}" font-size="9" fill="#5A6B8C" text-anchor="middle" font-family="Inter">${cats[i]}</text>`;
    bars+=`<text x="${x+barW/2}" y="${y-5}" font-size="10" fill="#1B2A4A" text-anchor="middle" font-family="IBM Plex Mono, monospace">${v}</text>`;
  });
  const axisLine=`<line x1="${m.left}" y1="${m.top+ph}" x2="${m.left+pw}" y2="${m.top+ph}" stroke="#1B2A4A" stroke-width="1.5"/>`;
  const svg=svgWrap(width,height, axisLine+bars);
  const askWhat=choice(['highest','total','difference']);
  let text,correct,distractors,explanation;
  const total=values.reduce((s,x)=>s+x,0);
  const maxIdx=values.indexOf(maxV);
  if(askWhat==='highest'){
    text=`${svg}<div>The bar chart shows how many pupils in a class play each sport. Which sport is most popular?</div>`;
    correct=cats[maxIdx];
    distractors=cats.filter((c,i)=>i!==maxIdx);
    explanation=`${cats[maxIdx]} has the tallest bar, with ${maxV} pupils.`;
  }else if(askWhat==='total'){
    text=`${svg}<div>The bar chart shows how many pupils in a class play each sport. How many pupils are there in total?</div>`;
    correct=total;
    distractors=[total+values[0],total-values[0],maxV];
    explanation=`Add all the bars: ${values.join(' + ')} = ${total}.`;
  }else{
    const i1=0,i2=maxIdx===0?1:0;
    const diff=Math.abs(values[i1]-values[i2]);
    const bigger= values[i1]>=values[i2]?cats[i1]:cats[i2];
    const smaller= values[i1]>=values[i2]?cats[i2]:cats[i1];
    text=`${svg}<div>The bar chart shows how many pupils in a class play each sport. How many more pupils play ${bigger} than ${smaller}?</div>`;
    correct=diff;
    distractors=[diff+2,Math.max(0,diff-2),values[i1]+values[i2]];
    explanation=`Difference = ${Math.max(values[i1],values[i2])} − ${Math.min(values[i1],values[i2])} = ${diff}.`;
  }
  return finalize('Graphs','barChartRead',text,correct,distractors,explanation);
}
function genPieChart(){
  const cats=shuffle(['Walk','Bus','Car','Bike']).slice(0,3);
  let raw=cats.map(()=>randInt(1,6));
  const total=raw.reduce((s,x)=>s+x,0);
  const colors=['#F2B705','#5A9BD5','#D9635C'];
  let cum=0;
  let paths='';
  const cx=100,cy=100,r=80;
  raw.forEach((v,i)=>{
    const angleSize=v/total*360;
    const start=cum, end=cum+angleSize;
    paths+=`<path d="${describeArc(cx,cy,r,start,end)}" fill="${colors[i%colors.length]}" stroke="#fff" stroke-width="2"/>`;
    cum=end;
  });
  const legend=cats.map((c,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:500;"><span style="width:10px;height:10px;border-radius:3px;background:${colors[i%colors.length]};display:inline-block;"></span>${c} (${raw[i]}/${total})</div>`).join('');
  const svg=`<svg viewBox="0 0 200 200" width="180" height="180" style="display:block;margin:14px auto 6px;">${paths}</svg><div style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;">${legend}</div>`;
  const targetIdx=randInt(0,cats.length-1);
  const g=gcd(raw[targetIdx],total)||1;
  const simpN=raw[targetIdx]/g, simpD=total/g;
  const correct=simpD===1?'1':`${simpN}/${simpD}`;
  const text=`${svg}<div>The pie chart shows how pupils travel to school. What fraction of pupils travel by ${cats[targetIdx]}?</div>`;
  const distractors=[`${raw[targetIdx]}/${total}`,`${total-raw[targetIdx]}/${total}`,`${simpN}/${total}`];
  const explanation=`${cats[targetIdx]}: ${raw[targetIdx]} out of ${total} pupils = ${correct} in simplest form.`;
  return finalize('Graphs','pieChartRead',text,correct,distractors,explanation);
}
function genScatter(){
  const type=choice(['positive','negative','none']);
  const width=280,height=220;
  const m={left:34,right:14,top:14,bottom:30};
  const pw=width-m.left-m.right, ph=height-m.top-m.bottom;
  let points=[];
  for(let i=0;i<12;i++){
    const x=randInt(0,10);
    let y;
    if(type==='positive') y=Math.min(10,Math.max(0, x+randInt(-2,2)));
    else if(type==='negative') y=Math.min(10,Math.max(0, 10-x+randInt(-2,2)));
    else y=randInt(0,10);
    points.push([x,y]);
  }
  const toPx=(x,y)=>({x:m.left+(x/10)*pw, y:m.top+ph-(y/10)*ph});
  const dots=points.map(([x,y])=>{const p=toPx(x,y);return `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#1B2A4A"/>`;}).join('');
  const border=`<rect x="${m.left}" y="${m.top}" width="${pw}" height="${ph}" fill="none" stroke="#CBDBF2"/>`;
  const svg=svgWrap(width,height, border+dots);
  const text=`${svg}<div>What type of correlation does this scatter graph show?</div>`;
  const correct=type==='positive'?'Positive correlation':type==='negative'?'Negative correlation':'No correlation';
  const allOptions=['Positive correlation','Negative correlation','No correlation','Weak correlation'];
  const distractors=allOptions.filter(o=>o!==correct);
  const explanation=type==='positive'?'As one variable increases, so does the other — a positive correlation.':type==='negative'?'As one variable increases, the other decreases — a negative correlation.':'The points are scattered with no clear pattern — no correlation.';
  return finalize('Graphs','scatterCorrelation',text,correct,distractors,explanation);
}
function genDistanceTime(){
  const t1=randInt(1,3);
  const speed1=randInt(10,40);

  const stopDur=randInt(1,2);
  const t2=t1+stopDur;
  const t3choice=randInt(1,3);
  const t3=t2+t3choice;

  const frame=chartFrame(xMin,xMax,yMin,yMax,1,Math.ceil(yMax/6),300,240,false);

  const path=pts.map((p,i)=>`${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
  const lineSvg=`<path d="${path}" fill="none" stroke="#1B2A4A" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#D9635C"/>`).join('');
  const svg=svgWrap(frame.width,frame.height, frame.svgBase+lineSvg);
  const askWhat=choice(['speed1','fastLeg','stopDuration']);

  if(askWhat==='stopDuration'){
    text=`${svg}<div>The graph shows a car's distance from home over time. How long did the car stop for?</div>`;
    correct=`${stopDur} hour${stopDur>1?'s':''}`;
    distractors=[`${t1} hour${t1>1?'s':''}`,`${t3choice} hour${t3choice>1?'s':''}`,`${stopDur+1} hour${stopDur+1>1?'s':''}`];
    explanation=`The distance stays flat between t = ${t1} and t = ${t2}, a stop of ${stopDur} hour${stopDur>1?'s':''}.`;
  }else if(askWhat==='fastLeg'){
    text=`${svg}<div>The graph shows a car's distance from home over time. During which section was the car travelling fastest?</div>`;
    correct = speed1>=speed2? legALabel: legBLabel;
    distractors=[speed1>=speed2?legBLabel:legALabel, `${t1}–${t2} hrs`, `0–${t3} hrs`];
    explanation=`Speed = distance ÷ time. ${legALabel}: ${speed1} units/hr. ${legBLabel}: ${speed2} units/hr. The steeper section is faster.`;
  }else{
    text=`${svg}<div>The graph shows a car's distance from home over time. What was its speed during the first ${t1} hour${t1>1?'s':''}?</div>`;
    correct=`${speed1} units/hr`;
    distractors=[`${speed1+5} units/hr`,`${Math.max(1,speed1-5)} units/hr`,`${d1} units/hr`];
    explanation=`Speed = distance ÷ time = ${d1} ÷ ${t1} = ${speed1} units/hr.`;
  }
  return finalize('Graphs','distanceTimeGraph',text,correct,distractors,explanation);
}

function genQuadraticGraph(){
  const p=randInt(-3,3);
  const q=randInt(-4,4);
  const xMin=p-5, xMax=p+5;
  const pts=[];
  for(let x=xMin;x<=xMax+0.001;x+=0.5){ pts.push([x,(x-p)*(x-p)+q]); }
  const yVals=pts.map(pt=>pt[1]);
  const yMin=Math.floor(Math.min(...yVals))-1, yMax=Math.ceil(Math.max(...yVals))+1;
  const frame=chartFrame(xMin,xMax,yMin,yMax,null,null,300,240);
  const pxPts=pts.map(([x,y])=>frame.toPx(x,y));
  const path=pxPts.map((pp,i)=>`${i===0?'M':'L'} ${pp.x} ${pp.y}`).join(' ');
  const curve=`<path d="${path}" fill="none" stroke="#1B2A4A" stroke-width="2.5"/>`;
  const svg=svgWrap(frame.width,frame.height, frame.svgBase+curve);
  const text=`${svg}<div>The graph shows y = (x − ${p})² ${q>=0?'+':'−'} ${Math.abs(q)}. What are the coordinates of the turning point?</div>`;
  const correct=`(${p}, ${q})`;
  const distractors=[`(${-p}, ${q})`,`(${p}, ${-q})`,`(${q}, ${p})`];
  const explanation=`For y = (x − a)² + b, the turning point (minimum) is at (a, b) = (${p}, ${q}).`;
  return finalize('Graphs','quadraticGraph',text,correct,distractors,explanation);
}

function genSimplifyRatio(){

/* ---------- Geometry & Measures ---------- */
function genAngles(depth){
  depth=depth||0;
  const scenario=choice(['line','point','triangle']);
  let total,known,text;
  if(scenario==='line'){total=180;known=[randInt(20,140)];text=`Two angles lie on a straight line. One is ${known[0]}°. Find the other angle.`;}
  else if(scenario==='point'){total=360;const k1=randInt(40,150),k2=randInt(40,150);known=[k1,k2];text=`Three angles meet at a point. Two of them are ${k1}° and ${k2}°. Find the third angle.`;}
  else{total=180;const k1=randInt(30,90),k2=randInt(30,90);known=[k1,k2];text=`In a triangle, two angles are ${k1}° and ${k2}°. Find the third angle.`;}
  const sumKnown=known.reduce((s,x)=>s+x,0);
  const correctVal=total-sumKnown;
  if(correctVal<=0 && depth<10) return genAngles(depth+1);
  const wrongTotal=total===180?360:180;
  const distractors=[wrongTotal-sumKnown,sumKnown,correctVal+10].filter(v=>v>0);
  const explanation=`Angles ${scenario==='line'?'on a straight line sum to 180°':scenario==='point'?'around a point sum to 360°':'in a triangle sum to 180°'}. ${total} − ${sumKnown} = ${correctVal}.`;
  return finalize('Geometry & Measures','angles',text,`${correctVal}°`,distractors.map(v=>`${v}°`),explanation);
}
function genPolygonAngles(){
  const n=choice([5,6,8,9,10,12]);

  const exterior=360/n;

  const correct= mode==='interior'? `${interior}°` : `${exterior}°`;
  const distractors=[mode==='interior'?`${exterior}°`:`${interior}°`, `${Math.round(180/n)}°`, `${interior+10}°`];
  const explanation=`Exterior angle = 360÷${n} = ${exterior}°. Interior angle = 180 − exterior = ${interior}°.`;
  return finalize('Geometry & Measures','polygonAngles',text,correct,distractors,explanation);
}
function genArea(){

function genPythagoras(){
  const triples=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25],[9,12,15],[20,21,29]];

  const correct=`${correctVal} cm`;
  const distractors=[`${a+b} cm`,`${Math.round(Math.sqrt(a+b))} cm`,`${correctVal+1} cm`];
  const explanation=findHyp?`c² = a² + b² = ${a}² + ${b}² = ${a*a+b*b}, so c = ${correctVal} cm.`:`b² = c² − a² = ${c}² − ${a}² = ${c*c-a*a}, so b = ${correctVal} cm.`;
  return finalize('Geometry & Measures','pythagoras',text,correct,distractors,explanation);

function genCircle(){
  const r=randInt(2,15);
  const mode=choice(['area','circumference']);
  const pi=3.14159;
  const unit=mode==='area'?' cm²':' cm';
  let text,correctVal;
  if(mode==='area'){text=`Find the area of a circle with radius ${r} cm. Use π ≈ 3.14 and round to 1 decimal place.`;correctVal=Math.round(pi*r*r*10)/10;}
  else{text=`Find the circumference of a circle with radius ${r} cm. Use π ≈ 3.14 and round to 1 decimal place.`;correctVal=Math.round(2*pi*r*10)/10;}
  const correct=`${correctVal}${unit}`;
  const altUsingDiameter=mode==='area'?Math.round(pi*(2*r)*(2*r)*10)/10:Math.round(2*pi*(2*r)*10)/10;
  const swapFormula=mode==='area'?Math.round(2*pi*r*10)/10:Math.round(pi*r*r*10)/10;
  const distractors=[`${altUsingDiameter}${unit}`,`${swapFormula}${unit}`,`${Math.round((correctVal+5)*10)/10}${unit}`];
  const explanation=mode==='area'?`Area = πr² = 3.14 × ${r}² ≈ ${correct}.`:`Circumference = 2πr = 2 × 3.14 × ${r} ≈ ${correct}.`;
  return finalize('Geometry & Measures','circle',text,correct,distractors,explanation);
}

    question=`Point A is at (${px}, ${py}). It is translated by the vector (${vx}, ${vy}). What are the coordinates of the image point?`;
  }else if(type==='reflectX'){
    qx=px; qy=-py;
    question=`Point A is at (${px}, ${py}). It is reflected in the x-axis. What are the coordinates of the image point?`;
  }else{
    qx=-px; qy=py;
    question=`Point A is at (${px}, ${py}). It is reflected in the y-axis. What are the coordinates of the image point?`;
  }
  const dots=`<circle cx="${origPt.x}" cy="${origPt.y}" r="4" fill="#1B2A4A"/><text x="${origPt.x+6}" y="${origPt.y-6}" font-size="10" font-family="Inter">A</text>`;
  const svg=svgWrap(frame.width,frame.height, frame.svgBase+dots);
  const text=`${svg}<div>${question}</div>`;
  const correct=`(${qx}, ${qy})`;
  const distractors=[`(${qy}, ${qx})`,`(${-qx}, ${qy})`,`(${qx}, ${-qy})`];
  const explanation=type==='translate'?`Add the translation vector to the coordinates of A to get (${qx}, ${qy}).`:type==='reflectX'?`Reflecting in the x-axis keeps x the same and flips the sign of y: (${qx}, ${qy}).`:`Reflecting in the y-axis keeps y the same and flips the sign of x: (${qx}, ${qy}).`;
  return finalize('Geometry & Measures','transformations',text,correct,distractors,explanation);
}
function genTrig(){
  const angle=choice([30,45,60]);
  const funcs={30:{sin:0.5,cos:0.866,tan:0.577},45:{sin:0.707,cos:0.707,tan:1},60:{sin:0.866,cos:0.5,tan:1.732}};
  const ratio=choice(['sin','cos','tan']);
  const known=randInt(5,20);
  const val=funcs[angle][ratio];
  let text;
  if(ratio==='sin') text=`In a right-angled triangle, one angle is ${angle}° and the hypotenuse is ${known} cm. Find the length of the opposite side. Round to 1 decimal place.`;
  else if(ratio==='cos') text=`In a right-angled triangle, one angle is ${angle}° and the hypotenuse is ${known} cm. Find the length of the adjacent side. Round to 1 decimal place.`;
  else text=`In a right-angled triangle, one angle is ${angle}° and the adjacent side is ${known} cm. Find the length of the opposite side. Round to 1 decimal place.`;
  const correctVal=Math.round(known*val*10)/10;
  const correct=`${correctVal} cm`;
  const distractors=[`${Math.round(known*(1-val)*10)/10} cm`,`${known} cm`,`${Math.round(correctVal*1.3*10)/10} cm`];
  const explanation=ratio==='sin'?`sin(${angle}°) = opposite/hypotenuse, so opposite = ${known} × sin(${angle}°) ≈ ${correct}.`:ratio==='cos'?`cos(${angle}°) = adjacent/hypotenuse, so adjacent = ${known} × cos(${angle}°) ≈ ${correct}.`:`tan(${angle}°) = opposite/adjacent, so opposite = ${known} × tan(${angle}°) ≈ ${correct}.`;
  return finalize('Geometry & Measures','trigonometry',text,correct,distractors,explanation);
}

function genTrigFindAngle(){
  const opp=randInt(3,15), adj=randInt(3,15);
  const angle=Math.atan(opp/adj)*180/Math.PI;
  const correct=Math.round(angle*10)/10;
  const text=`In a right-angled triangle, the opposite side is ${opp} cm and the adjacent side is ${adj} cm. Find the angle between the hypotenuse and the adjacent side, to 1 decimal place.`;
  const distractors=[Math.round((90-angle)*10)/10, Math.round((angle+10)*10)/10, Math.round((angle-10)*10)/10];
  const explanation=`tan(angle) = opposite/adjacent = ${opp}/${adj}. angle = tan⁻¹(${(opp/adj).toFixed(3)}) ≈ ${correct}°.`;
  return finalize('Geometry & Measures','trigFindAngle',text,`${correct}°`,distractors.map(d=>`${d}°`),explanation);
}
function genCircleSector(){
  const r=randInt(4,12);

  const mode=choice(['area','arc']);

    unit=' cm²';
    text=`Find the area of a sector with radius ${r} cm and angle ${angle}°. Use π ≈ 3.14 and round to 1 decimal place.`;
  }else{
    correctVal=Math.round(2*pi*r*(angle/360)*10)/10;
    unit=' cm';
    text=`Find the arc length of a sector with radius ${r} cm and angle ${angle}°. Use π ≈ 3.14 and round to 1 decimal place.`;
  }
  const correct=`${correctVal}${unit}`;
  const fullCircleVal= mode==='area'? Math.round(pi*r*r*10)/10 : Math.round(2*pi*r*10)/10;
  const distractors=[`${fullCircleVal}${unit}`,`${Math.round(correctVal*2*10)/10}${unit}`,`${Math.round((correctVal+5)*10)/10}${unit}`];
  const explanation= mode==='area'? `Sector area = (angle/360) × πr² = (${angle}/360) × 3.14 × ${r}² ≈ ${correct}.` : `Arc length = (angle/360) × 2πr = (${angle}/360) × 2 × 3.14 × ${r} ≈ ${correct}.`;
  return finalize('Geometry & Measures','circleSector',text,correct,distractors,explanation);

function genSurfaceArea(){

/* ---------- Probability & Statistics ---------- */
function genProbability(){
  const colors=shuffle(['red','blue','green','yellow','white']);
  const numColors=choice([2,3]);
  const chosenColors=colors.slice(0,numColors);
  const counts=chosenColors.map(()=>randInt(2,10));
  const total=counts.reduce((s,x)=>s+x,0);
  const targetIdx=randInt(0,numColors-1);
  const target=chosenColors[targetIdx];
  const desc=chosenColors.map((c,i)=>`${counts[i]} ${c}`).join(', ');
  const text=`A bag contains ${desc} balls. One ball is picked at random. Find the probability it is ${target}.`;
  const g=gcd(counts[targetIdx],total)||1;
  const simpN=counts[targetIdx]/g, simpD=total/g;
  const correct=simpD===1?'1':`${simpN}/${simpD}`;
  const distractors=[`${counts[targetIdx]}/${total}`,`${total-counts[targetIdx]}/${total}`,`${simpN}/${total}`];
  const explanation=`P(${target}) = ${counts[targetIdx]}/${total} = ${correct} in simplest form.`;
  return finalize('Probability & Statistics','probability',text,correct,distractors,explanation);
}
function genAverages(depth){
  depth=depth||0;
  const stat=choice(['mean','median','range','mode']);
  const n=choice([5,7]);
  let data=Array.from({length:n},()=>randInt(1,30));
  const sorted=[...data].sort((a,b)=>a-b);
  if(stat==='mean'){
    const sum=data.reduce((s,x)=>s+x,0);
    if(sum%n!==0 && depth<10) return genAverages(depth+1);
    const correctVal=sum/n;
    const text=`Find the mean of this set of data: ${data.join(', ')}`;
    const distractors=[sorted[(n-1)>>1],sorted[n-1]-sorted[0],correctVal+1];
    return finalize('Probability & Statistics','averages',text,correctVal,distractors,`Mean = sum ÷ count = ${sum} ÷ ${n} = ${correctVal}.`);
  }
  if(stat==='median'){
    const correctVal=sorted[(n-1)/2];
    const text=`Find the median of this set of data: ${data.join(', ')}`;
    const distractors=[sorted[n-1]-sorted[0],sorted[0],sorted[n-1]];
    return finalize('Probability & Statistics','averages',text,correctVal,distractors,`Arrange in order: ${sorted.join(', ')}. The middle value is ${correctVal}.`);
  }
  if(stat==='range'){
    const correctVal=sorted[n-1]-sorted[0];
    const text=`Find the range of this set of data: ${data.join(', ')}`;
    const distractors=[sorted[n-1],sorted[0],correctVal+2];
    return finalize('Probability & Statistics','averages',text,correctVal,distractors,`Range = largest − smallest = ${sorted[n-1]} − ${sorted[0]} = ${correctVal}.`);
  }
  data[n-1]=data[0];
  const sorted2=[...data].sort((a,b)=>a-b);
  const correctVal=data[0];
  const text=`Find the mode of this set of data: ${data.join(', ')}`;
  const distractors=[sorted2[sorted2.length-1],sorted2[0],correctVal+1];
  return finalize('Probability & Statistics','averages',text,correctVal,distractors,`The mode is the most frequently occurring value: ${correctVal}.`);
}
function genCombinedProbability(){
  const p1n=randInt(1,4), p1d=randInt(p1n+1,8);
  const p2n=randInt(1,4), p2d=randInt(p2n+1,8);
  const text=`Event A has probability ${p1n}/${p1d}. Independent event B has probability ${p2n}/${p2d}. Find P(A and B).`;
  const numCorrect=p1n*p2n, denCorrect=p1d*p2d;
  const g=gcd(numCorrect,denCorrect)||1;
  const simpN=numCorrect/g, simpD=denCorrect/g;
  const correct=simpD===1?'1':`${simpN}/${simpD}`;
  const distractors=[`${numCorrect}/${denCorrect}`,`${p1n+p2n}/${p1d+p2d}`,`${simpN}/${denCorrect}`];
  const explanation=`For independent events, P(A and B) = P(A) × P(B) = ${p1n}/${p1d} × ${p2n}/${p2d} = ${correct}.`;
  return finalize('Probability & Statistics','combinedProbability',text,correct,distractors,explanation);
}
function genFrequencyTable(depth){
  depth=depth||0;
  const values=[1,2,3,4,5];
  const freqs=values.map(()=>randInt(1,8));
  const totalFreq=freqs.reduce((s,x)=>s+x,0);
  const totalSum=values.reduce((s,v,i)=>s+v*freqs[i],0);
  if(totalSum%totalFreq!==0 && depth<15) return genFrequencyTable(depth+1);
  const mean= totalSum%totalFreq===0? totalSum/totalFreq : Math.round((totalSum/totalFreq)*10)/10;
  const rows=values.map((v,i)=>`<tr><td style="padding:4px 10px;border:1px solid #CBDBF2;">${v}</td><td style="padding:4px 10px;border:1px solid #CBDBF2;">${freqs[i]}</td></tr>`).join('');
  const table=`<table style="border-collapse:collapse;margin:12px auto;font-family:'IBM Plex Mono',monospace;font-size:13px;"><tr><th style="padding:4px 10px;border:1px solid #CBDBF2;background:var(--bg);">Value</th><th style="padding:4px 10px;border:1px solid #CBDBF2;background:var(--bg);">Frequency</th></tr>${rows}</table>`;
  const text=`${table}<div>Find the mean of the data shown in the frequency table.</div>`;
  const distractors=[Math.round(totalSum/values.length),Math.round((mean+1)*10)/10,totalFreq];
  const explanation=`Mean = (sum of value × frequency) ÷ total frequency = ${totalSum} ÷ ${totalFreq} = ${mean}.`;
  return finalize('Probability & Statistics','frequencyTableAverage',text,mean,distractors,explanation);
}

function genProbabilityWithoutReplacement(){
  const colorsAll=shuffle(['red','blue','green','yellow']);
  const numColors=choice([2,3]);
  const chosenColors=colorsAll.slice(0,numColors);
  const counts=chosenColors.map(()=>randInt(3,8));
  const total=counts.reduce((s,x)=>s+x,0);
  const targetIdx=randInt(0,numColors-1);
  const target=chosenColors[targetIdx];
  const desc=chosenColors.map((c,i)=>`${counts[i]} ${c}`).join(', ');
  const text=`A bag contains ${desc} balls. Two balls are picked at random without replacement. Find the probability that both are ${target}.`;
  const n=counts[targetIdx];
  const numCorrect=n*(n-1), denCorrect=total*(total-1);
  const g=gcd(numCorrect,denCorrect)||1;
  const simpN=numCorrect/g, simpD=denCorrect/g;
  const correct=simpD===1?'1':`${simpN}/${simpD}`;
  const distractors=[`${n*n}/${total*total}`,`${numCorrect}/${denCorrect}`,`${n}/${total}`];
  const explanation=`P(1st ${target}) = ${n}/${total}. Without replacement, P(2nd ${target}) = ${n-1}/${total-1}. Multiply: ${n}/${total} × ${n-1}/${total-1} = ${correct}.`;
  return finalize('Probability & Statistics','probabilityWithoutReplacement',text,correct,distractors,explanation);
}

function pickEntry(pool,targetDiff){
  let candidates=pool.filter(e=>e.diff===targetDiff);
  if(candidates.length===0){
    const diffs=[...new Set(pool.map(e=>e.diff))];
    diffs.sort((a,b)=>Math.abs(a-targetDiff)-Math.abs(b-targetDiff));
    candidates=pool.filter(e=>e.diff===diffs[0]);
  }
  return choice(candidates);
}
function buildDifficultySequence(n,pattern){
  if(pattern==='mixed') return Array.from({length:n},()=>choice([1,2,3,4]));
  const seq=[];
  for(let i=0;i<n;i++){
    const frac= n>1? i/(n-1) : 0;
    let d;
    if(frac<0.25) d=1; else if(frac<0.55) d=2; else if(frac<0.8) d=3; else d=4;
    seq.push(d);
  }
  return seq;
}

async function loadInitial(){
  state.screen='home';
  render();

  try{
    const items=[];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('history:')) {
            try { 
                const v = localStorage.getItem(k);
                if(v) items.push(JSON.parse(v)); 
            } catch(e){}
        }
    }
    items.sort((a,b)=>b.ts-a.ts);
    state.history=items;
  }catch(e){ state.history=[]; }

  if(state.screen==='home') render();
}

async function saveHistoryEntry(entry){
  state.history.unshift(entry);
  try{ localStorage.setItem('history:'+entry.id, JSON.stringify(entry)); }catch(e){}
}

async function clearHistory(){
  const items=state.history;
  state.history=[];
  render();
  for(const item of items){
    try{ localStorage.removeItem('history:'+item.id); }catch(e){}
  }
}

/* ==================== Quiz flow ==================== */
function startQuiz(){
  const chapters=state.mode==='full'?CHAPTERS.map(c=>c.id):state.selectedChapters;
  if(chapters.length===0){ alert('Pick at least one chapter to practise.'); return; }
  const pool=GEN_ENTRIES.filter(e=>chapters.includes(e.chapter));
  if(pool.length===0){ alert('No question types available for this selection.'); return; }
  const diffSeq=buildDifficultySequence(state.questionCount,state.difficultyPattern);
  const questions=diffSeq.map(d=>{
    const entry=pickEntry(pool,d);
    const q=entry.fn();
    q.difficulty=entry.diff;
    return q;
  });
  state.quiz={questions,index:0,correctCount:0,answered:null,breakdown:{},answers:new Array(questions.length).fill(null)};
  state.screen='quiz';
  render();
}
function answerQuestion(choiceIdx){
  const q=state.quiz;
  if(q.answered!==null) return;
  q.answered=choiceIdx;
  q.answers[q.index]=choiceIdx;
  const question=q.questions[q.index];
  const isCorrect=choiceIdx===question.correctIndex;
  if(isCorrect) q.correctCount++;
  if(!q.breakdown[question.topic]) q.breakdown[question.topic]={correct:0,total:0};
  q.breakdown[question.topic].total++;
  if(isCorrect) q.breakdown[question.topic].correct++;
  render();
}
function nextQuestion(){
  const q=state.quiz;
  if(q.index+1<q.questions.length){ q.index++; q.answered=null; render(); }
  else{ finishQuiz(); }
}
async function finishQuiz(){
  const q=state.quiz;
  const now=new Date();
  const entry={
    id:uid(), ts:now.getTime(), date:now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),
    time:now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    total:q.questions.length, correct:q.correctCount, breakdown:q.breakdown,
    mode:state.mode==='full'?'Full curriculum':state.selectedChapters.map(id=>CHAPTERS.find(c=>c.id===id).label).join(', ')
  };
  await saveHistoryEntry(entry);
  state.screen='summary';
  state.lastEntry=entry;
  render();
}
function buildSummaryText(entry){
  const pct=Math.round(entry.correct/entry.total*100);
  const lines=[`Maths practice summary — ${entry.date}`,'',`Score: ${entry.correct}/${entry.total} (${pct}%)`,`Topics: ${entry.mode}`,'','Breakdown by topic:'];
  Object.entries(entry.breakdown).forEach(([topic,st])=>{ lines.push(`  ${topic}: ${st.correct}/${st.total}`); });
  return {subject:`Maths practice summary – ${entry.date} (${pct}%)`, body:lines.join('\n')};
}
async function shareSummary(entry){
  const {subject,body}=buildSummaryText(entry);
  if(navigator.share){
    try{ await navigator.share({title:subject, text:body}); }
    catch(e){ /* user cancelled the native share sheet — not an error */ }
  }
}
function copySummaryText(btn){
  const ta=document.getElementById('summary-textarea');
  if(!ta) return;
  ta.focus();
  ta.select();
  ta.setSelectionRange(0,999999);
  let copied=false;
  try{ copied=document.execCommand('copy'); }catch(e){}
  if(!copied && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>{}).catch(()=>{});
    copied=true;
  }
  if(btn){
    const original=btn.textContent;
    btn.textContent=copied?'Copied ✓':'Now press copy';
    setTimeout(()=>{ btn.textContent=original; },1600);
  }
}

function questionPreviewText(html){
  let t=String(html||'').replace(/<svg[\s\S]*?<\/svg>/g,'');
  t=t.replace(/<br\s*\/?>/gi,' ');
  t=t.replace(/<[^>]+>/g,' ');
  t=t.replace(/\s+/g,' ').trim();
  if(t.length>90) t=t.slice(0,87)+'…';
  return t;
}

      <div class="brand"><h1>Year 9 Maths</h1><span class="chapter-tag">practice book</span></div>
      <div style="display:flex;gap:8px;">
        <div class="iconbtn" onclick="goHistory()" title="History">☷</div>
      </div>
    </div>
    ${content}
  `;
}

function renderHome(){
  const chaptersHtml=CHAPTERS.map(c=>{
    const sel=state.selectedChapters.includes(c.id);
    const count=GEN_ENTRIES.filter(e=>e.chapter===c.id).length;
    return `<div class="chapter-row ${state.mode==='choose'&&sel?'selected':''}" onclick="toggleChapter('${c.id}')">
      <div class="chapter-num">0${c.chapter}</div>
      <div>
        <div class="chapter-label">${c.label}</div>
        <div class="chapter-sub">${count} question types</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="page">
    <div class="eyebrow">New practice set</div>
    <div class="section-title">Ready for some practice?</div>
    <div class="muted">Genius is 1% talent and 99% hard work.</div>

    <div class="mode-toggle">
      <div class="mode-btn ${state.mode==='full'?'active':''}" onclick="setMode('full')">Full curriculum, random</div>
      <div class="mode-btn ${state.mode==='choose'?'active':''}" onclick="setMode('choose')">Choose chapters</div>
    </div>

    ${state.mode==='choose'?`<div class="chapters">${chaptersHtml}</div>`:''}

    <div class="eyebrow" style="margin-top:22px;">How many questions?</div>
    <div class="count-row">
      ${[5,10,30].map(n=>`<div class="count-btn ${state.questionCount===n?'active':''}" onclick="setCount(${n})">${n}</div>`).join('')}
    </div>

    <button class="btn-primary" onclick="startQuiz()">Start practice →</button>
  </div>
  ${state.history.length?renderRecentStrip():''}
  `;
}
function renderRecentStrip(){
  const last=state.history[0];
  const pct=Math.round(last.correct/last.total*100);
  return `<div class="muted" style="margin-top:16px;text-align:center;">Last set: ${last.correct}/${last.total} (${pct}%) on ${last.date} — <a href="#" onclick="goHistory();return false;" style="color:var(--ink);">view history</a></div>`;
}
function renderQuiz(){
  const q=state.quiz;
  const question=q.questions[q.index];
  const pct=Math.round(((q.index)/q.questions.length)*100);
  const choicesHtml=question.choices.map((c,i)=>{
    let cls='choice';
    if(q.answered!==null){
      cls+=' disabled';
      if(i===question.correctIndex) cls+=' correct';
      else if(i===q.answered) cls+=' wrong';
    }
    return `<div class="${cls}" onclick="answerQuestion(${i})">
      <div class="letter">${String.fromCharCode(65+i)}</div>
      <div>${c}</div>
    </div>`;
  }).join('');

  return `
  <div class="page">
    <div class="quiz-progress">
      <span class="qnum">Q${q.index+1} / ${q.questions.length}</span>
      <div class="ruler"><div class="ruler-fill" style="width:${pct}%"></div></div>
      <span class="qnum">${q.correctCount} correct</span>
    </div>
    <div class="topic-row">
      <span class="topic-chip">${question.topic}</span>
    </div>
    <div class="question-text">${question.text}</div>
    <div class="choices">${choicesHtml}</div>
    ${q.answered!==null?`<div class="explain">${question.explanation}</div><button class="btn-primary" onclick="nextQuestion()">${q.index+1<q.questions.length?'Next question →':'See summary →'}</button>`:''}
  </div>
  `;
}
function renderSummary(){
  const entry=state.lastEntry;
  const pct=Math.round(entry.correct/entry.total*100);
  const rows=Object.entries(entry.breakdown).map(([topic,st])=>{
    const p=Math.round(st.correct/st.total*100);
    return `<div class="breakdown-row">
      <div class="breakdown-label">${topic}</div>
      <div class="breakdown-bar"><div class="breakdown-fill ${p<60?'weak':''}" style="width:${p}%"></div></div>
      <div class="breakdown-val">${st.correct}/${st.total}</div>
    </div>`;
  }).join('');

  const {subject,body}=buildSummaryText(entry);
  const fullText=`Subject: ${subject}\n\n${body}`;
  const canShare= typeof navigator!=='undefined' && !!navigator.share;

  const primaryAction= canShare
    ? `<button class="btn-primary" onclick="shareSummary(state.lastEntry)">Share summary →</button>`
    : '';

  const quiz=state.quiz;
  const wrongIdxs= quiz? quiz.questions.map((qq,i)=>i).filter(i=>quiz.answers[i]!==quiz.questions[i].correctIndex) : [];
  const reviewHtml= wrongIdxs.length
    ? `<div class="eyebrow" style="margin-top:22px;">Questions to review (${wrongIdxs.length})</div>
       <div class="review-list">
         ${wrongIdxs.map(i=>{
           const qq=quiz.questions[i];
           return `<a href="#" class="review-link" onclick="reviewQuestion(${i});return false;">
             <span class="topic-chip">${qq.topic}</span>
             <span class="review-q">Q${i+1}: ${questionPreviewText(qq.text)}</span>
           </a>`;
         }).join('')}
       </div>`
    : `<div class="eyebrow" style="margin-top:22px;">Questions to review</div><div class="muted">Nice work — every question was answered correctly!</div>`;

  return `
  <div class="page">
    <div class="eyebrow">Set complete</div>
    <div class="summary-hero">
      <div class="summary-score">${entry.correct}/${entry.total}</div>
      <div class="summary-pct">${pct}% correct · ${entry.mode}</div>
    </div>
    <div class="breakdown">${rows}</div>

    ${reviewHtml}

    <div class="eyebrow" style="margin-top:22px;">Share your results</div>
    ${primaryAction}
    <div class="muted" style="margin-top:12px;">Copy the summary and paste it anywhere — Messages, WhatsApp, notes, email, and more:</div>
    <textarea class="field-input" id="summary-textarea" readonly style="height:120px;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;resize:vertical;">${fullText}</textarea>
    <button class="btn-secondary" onclick="copySummaryText(this)">Copy summary text</button>

    <div class="footer-links">
      <button class="btn-secondary" onclick="goHome()">Practice again</button>
      <button class="btn-secondary" onclick="goHistory()">View history</button>
    </div>
  </div>
  `;
}
function renderReview(){
  const quiz=state.quiz;
  const idx=state.reviewIndex;
  const question=quiz.questions[idx];
  const answered=quiz.answers[idx];
  const choicesHtml=question.choices.map((c,i)=>{
    let cls='choice disabled';
    if(i===question.correctIndex) cls+=' correct';
    else if(i===answered) cls+=' wrong';
    return `<div class="${cls}">
      <div class="letter">${String.fromCharCode(65+i)}</div>
      <div>${c}</div>
    </div>`;
  }).join('');

  return `
  <div class="page">
    <div class="eyebrow">Reviewing question ${idx+1} of ${quiz.questions.length}</div>
    <div class="topic-row">
      <span class="topic-chip">${question.topic}</span>
    </div>
    <div class="question-text">${question.text}</div>
    <div class="choices">${choicesHtml}</div>
    <div class="explain">${question.explanation}</div>
    <button class="btn-primary" onclick="backToSummary()">← Back to summary</button>
  </div>
  `;
}
function renderHistory(){
  const items=state.history.length?state.history.map(h=>{
    const pct=Math.round(h.correct/h.total*100);
    return `<div class="history-item">
      <div>
        <div class="history-score">${h.correct}/${h.total} <span style="color:var(--ink-soft);font-weight:500;font-size:13px;">(${pct}%)</span></div>
        <div class="history-date">${h.date}${h.time?' · '+h.time:''} · ${h.mode}</div>
      </div>
    </div>`;
  }).join(''):`<div class="empty-state">No practice sets yet — finish one and it'll show up here.</div>`;

  return `
  <div class="page">
    <div class="eyebrow">Progress</div>
    <div class="section-title">Practice history</div>
    <div style="margin-top:18px;">${items}</div>
    ${state.history.length?'<button class="btn-secondary" onclick="confirmClearHistory()">Clear history</button>':''}
    <button class="btn-secondary" onclick="goHome()">Back home</button>
  </div>
  `;
}
/* ==================== Event handlers ==================== */
function setMode(m){ state.mode=m; render(); }
function setCount(n){ state.questionCount=n; render(); }
function toggleChapter(id){
  if(state.selectedChapters.includes(id)) state.selectedChapters=state.selectedChapters.filter(c=>c!==id);
  else state.selectedChapters=[...state.selectedChapters,id];
  render();
}
function goHome(){ state.screen='home'; render(); }
function goHistory(){ state.screen='history'; render(); }
function confirmClearHistory(){
  if(confirm('Clear all saved practice history? This cannot be undone.')) clearHistory();
}
function reviewQuestion(idx){ state.reviewIndex=idx; state.screen='review'; render(); }
function backToSummary(){ state.screen='summary'; render(); }

window.startQuiz=startQuiz;
window.answerQuestion=answerQuestion;
window.nextQuestion=nextQuestion;
window.shareSummary=shareSummary;
window.copySummaryText=copySummaryText;
window.setMode=setMode;
window.setCount=setCount;
window.toggleChapter=toggleChapter;
window.goHome=goHome;
window.goHistory=goHistory;
window.confirmClearHistory=confirmClearHistory;
window.reviewQuestion=reviewQuestion;
window.backToSummary=backToSummary;
window.state=state;

try{ loadInitial(); }catch(e){ state.screen='home'; render(); }
setTimeout(()=>{ if(state.screen==='loading'){ state.screen='home'; render(); } }, 3000);
</script>
</body>
</html>
